---
properties:
  case:
    properties:
      available_variation_data: &keyword
        type: keyword
      case_id: *keyword
      demographic:
        properties:
          demographic_id: *keyword
      diagnoses:
        properties:
          diagnosis_id: *keyword
          pathology_details:
            properties:
              pathology_detail_id: *keyword
          treatments:
            properties:
              treatment_id: *keyword
      exposures:
        properties:
          exposure_id: *keyword
      follow_ups:
        properties:
          follow_up_id: *keyword
          molecular_tests:
            properties:
              molecular_test_id: *keyword
          other_clinical_attributes:
            properties:
              other_clinical_attribute_id: *keyword
      family_histories:
        properties:
          family_history_id: *keyword
      observation:
        properties:
          copy_number: &integer
            type: integer
          observation_id: *keyword
          sample:
            properties:
              tumor_sample_barcode: *keyword
              tumor_sample_uuid: *keyword
          sample_ploidy_integer: *integer
          src_file_id: *keyword
          variant_calling:
            properties:
              variant_caller: *keyword
          variant_status: *keyword
        type: nested
      project:
        properties:
          program:
            properties:
              program_id: *keyword
          project_id: *keyword
      samples:
        properties:
          portions:
            properties:
              analytes:
                properties:
                  aliquots:
                    properties:
                      aliquot_id: *keyword
                  analyte_id: *keyword
              portion_id: *keyword
              slides:
                properties:
                  slide_id: *keyword
          sample_id: *keyword
      tissue_source_site:
        properties:
          tissue_source_site_id: *keyword
  cnv:
    properties:
      chromosome: *keyword
      cnv_change: *keyword
      cnv_change_5_category: *keyword
      cnv_id: *keyword
      consequence:
        properties:
          consequence_id: *keyword
          gene:
            properties:
              biotype: *keyword
              gene_id: *keyword
              is_cancer_gene_census: &boolean
                type: boolean
              symbol: *keyword
        type: nested
      end_position: &long
        type: long
      gene_level_cn: *boolean
      ncbi_build: *keyword
      start_position: *long
      variant_status: *keyword
  cnv_occurrence_id: *keyword
