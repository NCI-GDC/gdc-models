---
properties:
  segment_cnv:
    properties:
      segment_cnv_id:
        copy_to:
          - segment_cnv_occurrence_autocomplete
  segment_cnv_occurrence_autocomplete:
    fields:
      analyzed:
        analyzer: autocomplete_analyzed
        search_analyzer: lowercase_keyword
        type: text
      lowercase:
        analyzer: lowercase_keyword
        type: text
      prefix:
        analyzer: autocomplete_prefix
        search_analyzer: lowercase_keyword
        type: text
    type: keyword
