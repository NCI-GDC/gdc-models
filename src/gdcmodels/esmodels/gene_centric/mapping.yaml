  cytoband:
    copy_to: *id001
    normalizer: clinical_normalizer
    type: keyword
  description:
    type: text
  external_db_ids:
    properties:
      entrez_gene:
        copy_to: *id001
        normalizer: clinical_normalizer
        type: keyword
      hgnc:
        copy_to: *id001
        normalizer: clinical_normalizer
        type: keyword
      omim_gene:
        copy_to: *id001
        normalizer: clinical_normalizer
        type: keyword
      uniprotkb_swissprot:
        copy_to: *id001
        normalizer: clinical_normalizer
        type: keyword
  gene_autocomplete:
    fields:
      analyzed:
        analyzer: autocomplete_analyzed
        search_analyzer: lowercase_keyword
        type: text
      lowercase:
        analyzer: lowercase_keyword
        type: text
      prefix:
        analyzer: autocomplete_prefix
        search_analyzer: lowercase_keyword
        type: text
    normalizer: clinical_normalizer
    type: keyword
  gene_chromosome:
    normalizer: clinical_normalizer
    type: keyword
  gene_end:
    type: long
  gene_id:
    copy_to: *id001
    type: keyword
  gene_start:
    type: long
  gene_strand:
    type: long
  is_cancer_gene_census:
    type: boolean
  name:
    copy_to: *id001
    type: keyword
  symbol:
    copy_to: *id001
    normalizer: clinical_normalizer
    type: keyword
  synonyms:
    copy_to: *id001
    normalizer: clinical_normalizer
    type: keyword
  transcripts:
    properties:
      biotype:
        type: keyword
      cdna_coding_end:
        type: long
      cdna_coding_start:
        type: long
      coding_region_end:
        type: long
      coding_region_start:
        type: long
      domains:
        properties:
          description:
            normalizer: clinical_normalizer
            type: keyword
          end:
            type: long
          gff_source:
            normalizer: clinical_normalizer
            type: keyword
          hit_name:
            normalizer: clinical_normalizer
            type: keyword
          interpro_id:
            normalizer: clinical_normalizer
            type: keyword
          start:
            type: long
        type: nested
      end:
        type: long
      end_exon:
