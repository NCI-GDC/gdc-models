          submitter_id:
            type: keyword
          tissue_type:
            normalizer: clinical_normalizer
            type: keyword
          tumor_descriptor:
            normalizer: clinical_normalizer
            type: keyword
        type: nested
      ssm:
        properties:
          chromosome:
            normalizer: clinical_normalizer
            type: keyword
          clinical_annotations:
            properties:
