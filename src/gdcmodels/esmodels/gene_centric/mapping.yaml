            type: keyword
          releasable:
            normalizer: clinical_normalizer
            type: keyword
          released:
            normalizer: clinical_normalizer
            type: keyword
          state:
            normalizer: clinical_normalizer
            type: keyword
      samples:
        properties:
          portions:
            properties:
              analytes:
                properties:
                  aliquots:
                    properties:
                      aliquot_id:
                        normalizer: clinical_normalizer
                        type: keyword
                      submitter_id:
                        type: keyword
                    type: nested
                  analyte_id:
                    normalizer: clinical_normalizer
                    type: keyword
                  analyte_type:
                    normalizer: clinical_normalizer
                    type: keyword
                  submitter_id:
                    type: keyword
                type: nested
              portion_id:
                normalizer: clinical_normalizer
                type: keyword
              slides:
                properties:
                  section_location:
                    normalizer: clinical_normalizer
                    type: keyword
                  slide_id:
                    normalizer: clinical_normalizer
                    type: keyword
                  submitter_id:
                    type: keyword
                type: nested
              submitter_id:
                type: keyword
            type: nested
          preservation_method:
            normalizer: clinical_normalizer
            type: keyword
          sample_id:
            normalizer: clinical_normalizer
            type: keyword
          specimen_type:
