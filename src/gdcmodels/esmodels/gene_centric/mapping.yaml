---
_size:
  enabled: true
_source:
  excludes:
    - case.*.*
    - case.consent_type
    - case.d*
    - case.i*
    - case.p*
    - case.s*
    - case.*_*_*
dynamic: strict
properties:
  biotype:
    type: keyword
  canonical_transcript_id:
    copy_to: &id001
      - gene_autocomplete
    normalizer: clinical_normalizer
    type: keyword
  canonical_transcript_length:
    type: long
  canonical_transcript_length_cds:
    type: long
  canonical_transcript_length_genomic:
    type: long
  case:
    properties:
      available_variation_data:
        normalizer: clinical_normalizer
        type: keyword
      case_id:
        normalizer: clinical_normalizer
        type: keyword
      cnv:
        properties:
          chromosome:
            normalizer: clinical_normalizer
            type: keyword
          cnv_change:
            normalizer: clinical_normalizer
            type: keyword
          cnv_change_5_category:
            normalizer: clinical_normalizer
            type: keyword
          cnv_id:
            normalizer: clinical_normalizer
            type: keyword
          end_position:
            type: long
          gene_level_cn:
            type: boolean
          ncbi_build:
            normalizer: clinical_normalizer
            type: keyword
          observation:
            properties:
              copy_number:
                type: integer
              observation_id:
                normalizer: clinical_normalizer
                type: keyword
              sample:
                properties:
                  tumor_sample_barcode:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_sample_uuid:
                    normalizer: clinical_normalizer
                    type: keyword
              sample_ploidy_integer:
                type: integer
              src_file_id:
                normalizer: clinical_normalizer
                type: keyword
              variant_calling:
                properties:
                  variant_caller:
                    normalizer: clinical_normalizer
                    type: keyword
              variant_status:
                normalizer: clinical_normalizer
                type: keyword
            type: nested
          start_position:
            type: long
        type: nested
      demographic:
        properties:
          demographic_id:
            normalizer: clinical_normalizer
            type: keyword
          ethnicity:
            normalizer: clinical_normalizer
            type: keyword
          race:
            normalizer: clinical_normalizer
            type: keyword
          sex_at_birth:
            normalizer: clinical_normalizer
            type: keyword
          submitter_id:
            type: keyword
          vital_status:
            normalizer: clinical_normalizer
            type: keyword
      diagnoses:
