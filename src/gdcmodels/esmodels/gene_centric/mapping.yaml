          cdna_end:
            type: long
          cdna_start:
            type: long
          end:
            type: long
          end_phase:
            type: long
          genomic_coding_end:
            type: long
          genomic_coding_start:
            type: long
          start:
            type: long
          start_phase:
            type: long
        type: nested
      is_canonical:
        type: boolean
      length:
        type: long
      length_amino_acid:
        type: long
      length_cds:
        type: long
      name:
        type: keyword
      number_of_exons:
        type: long
      seq_exon_end:
        type: long
      seq_exon_start:
        type: long
      start:
        type: long
      start_exon:
        type: long
      transcript_id:
        copy_to: *id001
        normalizer: clinical_normalizer
        type: keyword
      translation_id:
        copy_to: *id001
        normalizer: clinical_normalizer
        type: keyword
    type: nested
