                        type: keyword
                      uniparc:
                        normalizer: clinical_normalizer
                        type: keyword
                      vep_impact:
                        normalizer: clinical_normalizer
                        type: keyword
                  consequence_type:
                    type: keyword
                  ref_seq_accession:
                    normalizer: clinical_normalizer
                    type: keyword
                  transcript_id:
                    normalizer: clinical_normalizer
                    type: keyword
            type: nested
          cosmic_id:
            normalizer: clinical_normalizer
            type: keyword
          end_position:
            type: long
          genomic_dna_change:
            normalizer: clinical_normalizer
            type: keyword
          mutation_subtype:
            normalizer: clinical_normalizer
            type: keyword
          mutation_type:
            normalizer: clinical_normalizer
            type: keyword
          ncbi_build:
            normalizer: clinical_normalizer
            type: keyword
          observation:
            properties:
              center:
                normalizer: clinical_normalizer
                type: keyword
              input_bam_file:
                properties:
                  normal_bam_uuid:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_bam_uuid:
                    normalizer: clinical_normalizer
                    type: keyword
              mutation_status:
                normalizer: clinical_normalizer
                type: keyword
              normal_genotype:
                properties:
                  match_norm_seq_allele1:
                    normalizer: clinical_normalizer
                    type: keyword
                  match_norm_seq_allele2:
                    normalizer: clinical_normalizer
                    type: keyword
              observation_id:
                normalizer: clinical_normalizer
                type: keyword
              read_depth:
                properties:
                  n_depth:
                    type: long
                  t_alt_count:
                    type: long
                  t_depth:
                    type: long
                  t_ref_count:
                    type: long
              sample:
                properties:
                  matched_norm_sample_barcode:
                    normalizer: clinical_normalizer
                    type: keyword
                  matched_norm_sample_uuid:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_sample_barcode:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_sample_uuid:
                    normalizer: clinical_normalizer
                    type: keyword
              tumor_genotype:
                properties:
                  tumor_seq_allele1:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_seq_allele2:
                    normalizer: clinical_normalizer
                    type: keyword
              validation:
                properties:
                  tumor_validation_allele1:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_validation_allele2:
                    normalizer: clinical_normalizer
                    type: keyword
                  validation_method:
                    normalizer: clinical_normalizer
                    type: keyword
              variant_calling:
                properties:
                  variant_caller:
                    normalizer: clinical_normalizer
                    type: keyword
                  variant_process:
                    normalizer: clinical_normalizer
                    type: keyword
            type: nested
          reference_allele:
            normalizer: clinical_normalizer
            type: keyword
          ssm_id:
            normalizer: clinical_normalizer
            type: keyword
          start_position:
