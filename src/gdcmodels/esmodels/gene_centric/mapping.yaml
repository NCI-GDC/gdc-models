      used to generate it, it is either guaranteed to be different from all other
      UUIDs/GUIDs generated until 3400 AD or extremely likely to be different. Its
      relatively small size lends itself well to sorting, ordering, and hashing of
      all sorts, storing in databases, simple allocation, and ease of programming
      in general.
    genes.case.project.program.name: Full name/title of the program.
    genes.case.project.releasable: A project can only be released by the user when
      `releasable` is true.
    genes.case.project.released: To release a project is to tell the GDC to include
      all submitted entities in the next GDC index.
    genes.case.project.state: The possible states a project can be in.  All but `open`
      are equivalent to some type of locked state.
    genes.case.samples.portions.analytes.aliquots.submitter_id: A project-specific
      identifier for a node. This property is the calling card/nickname/alias for
      a unit of submission. It can be used in place of the uuid for identifying or
      recalling a node.
