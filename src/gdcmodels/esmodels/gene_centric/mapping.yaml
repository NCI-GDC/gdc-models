          age_at_diagnosis:
            type: long
          diagnosis_id:
            normalizer: clinical_normalizer
            type: keyword
          diagnosis_is_primary_disease:
            normalizer: clinical_normalizer
            type: keyword
          morphology:
            normalizer: clinical_normalizer
            type: keyword
          pathology_details:
            properties:
              pathology_detail_id:
                normalizer: clinical_normalizer
                type: keyword
              submitter_id:
                type: keyword
            type: nested
          primary_diagnosis:
            normalizer: clinical_normalizer
            type: keyword
          site_of_resection_or_biopsy:
            normalizer: clinical_normalizer
            type: keyword
          submitter_id:
            type: keyword
          tissue_or_organ_of_origin:
            normalizer: clinical_normalizer
            type: keyword
          treatments:
            properties:
              submitter_id:
                type: keyword
              treatment_id:
                normalizer: clinical_normalizer
                type: keyword
            type: nested
        type: nested
      disease_type:
        normalizer: clinical_normalizer
        type: keyword
      exposures:
        properties:
          exposure_id:
            normalizer: clinical_normalizer
            type: keyword
          submitter_id:
            type: keyword
        type: nested
      family_histories:
