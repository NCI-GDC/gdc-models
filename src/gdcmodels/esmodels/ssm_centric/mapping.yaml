---
_size:
  enabled: true
_source:
  excludes:
    - __comment__
dynamic: strict
properties:
  chromosome:
    normalizer: clinical_normalizer
    type: keyword
  clinical_annotations:
    properties:
      civic:
        properties:
          gene_id:
            type: keyword
          variant_id:
            normalizer: clinical_normalizer
            type: keyword
  consequence:
    properties:
      consequence_id:
        normalizer: clinical_normalizer
        type: keyword
      transcript:
        properties:
          aa_change:
            copy_to: &id001
              - ssm_autocomplete
            normalizer: clinical_normalizer
            type: keyword
          aa_end:
            type: long
          aa_start:
            type: long
          annotation:
            properties:
              amino_acids:
                normalizer: clinical_normalizer
                type: keyword
              ccds:
                normalizer: clinical_normalizer
                type: keyword
              cdna_position:
                normalizer: clinical_normalizer
                type: keyword
              cds_end:
                type: long
              cds_length:
                type: long
              cds_position:
                normalizer: clinical_normalizer
                type: keyword
              cds_start:
                type: long
              clin_sig:
                normalizer: clinical_normalizer
                type: keyword
              codons:
                normalizer: clinical_normalizer
                type: keyword
              dbsnp_rs:
                copy_to: *id001
                normalizer: clinical_normalizer
                type: keyword
              dbsnp_val_status:
                normalizer: clinical_normalizer
                type: keyword
              domains:
                normalizer: clinical_normalizer
                type: keyword
              ensp:
                normalizer: clinical_normalizer
                type: keyword
              existing_variation:
                normalizer: clinical_normalizer
                type: keyword
              hgvsc:
                normalizer: clinical_normalizer
                type: keyword
              hgvsp:
                normalizer: clinical_normalizer
                type: keyword
              hgvsp_short:
                normalizer: clinical_normalizer
                type: keyword
              polyphen_impact:
                normalizer: clinical_normalizer
                type: keyword
              polyphen_score:
                type: float
              protein_position:
                normalizer: clinical_normalizer
                type: keyword
              pubmed:
                normalizer: clinical_normalizer
                type: keyword
              sift_impact:
                normalizer: clinical_normalizer
                type: keyword
              sift_score:
                type: float
              swissprot:
                normalizer: clinical_normalizer
                type: keyword
              transcript_id:
                normalizer: clinical_normalizer
                type: keyword
              trembl:
                normalizer: clinical_normalizer
                type: keyword
              uniparc:
                normalizer: clinical_normalizer
                type: keyword
              vep_impact:
                normalizer: clinical_normalizer
                type: keyword
          consequence_type:
            type: keyword
          gene:
            properties:
              biotype:
                type: keyword
              canonical_transcript_id:
                normalizer: clinical_normalizer
                type: keyword
              cytoband:
                normalizer: clinical_normalizer
                type: keyword
              external_db_ids:
                properties:
                  entrez_gene:
                    normalizer: clinical_normalizer
                    type: keyword
                  hgnc:
                    normalizer: clinical_normalizer
                    type: keyword
                  omim_gene:
                    normalizer: clinical_normalizer
                    type: keyword
                  uniprotkb_swissprot:
                    normalizer: clinical_normalizer
                    type: keyword
              gene_chromosome:
                normalizer: clinical_normalizer
                type: keyword
              gene_end:
                type: long
              gene_id:
                type: keyword
              gene_start:
                type: long
              gene_strand:
                type: long
              is_cancer_gene_census:
                type: boolean
              symbol:
                normalizer: clinical_normalizer
                type: keyword
              synonyms:
                normalizer: clinical_normalizer
                type: keyword
          is_canonical:
            type: boolean
          ref_seq_accession:
            normalizer: clinical_normalizer
            type: keyword
          transcript_id:
            normalizer: clinical_normalizer
            type: keyword
    type: nested
  cosmic_id:
    copy_to: *id001
    normalizer: clinical_normalizer
    type: keyword
  end_position:
    type: long
  gene_aa_change:
    copy_to: *id001
    normalizer: clinical_normalizer
    type: keyword
  genomic_dna_change:
    copy_to: *id001
    normalizer: clinical_normalizer
    type: keyword
  mutation_subtype:
    normalizer: clinical_normalizer
    type: keyword
  mutation_type:
    normalizer: clinical_normalizer
    type: keyword
  ncbi_build:
    normalizer: clinical_normalizer
    type: keyword
  occurrence:
    properties:
      case:
        properties:
          available_variation_data:
            normalizer: clinical_normalizer
            type: keyword
          case_id:
            normalizer: clinical_normalizer
            type: keyword
          demographic:
            properties:
              demographic_id:
                normalizer: clinical_normalizer
                type: keyword
              ethnicity:
                normalizer: clinical_normalizer
                type: keyword
              race:
                normalizer: clinical_normalizer
                type: keyword
              sex_at_birth:
                normalizer: clinical_normalizer
                type: keyword
              submitter_id:
                type: keyword
              vital_status:
                normalizer: clinical_normalizer
                type: keyword
          diagnoses:
            properties:
              age_at_diagnosis:
                type: long
              diagnosis_id:
                normalizer: clinical_normalizer
                type: keyword
              diagnosis_is_primary_disease:
                normalizer: clinical_normalizer
                type: keyword
              morphology:
                normalizer: clinical_normalizer
                type: keyword
              pathology_details:
                properties:
                  pathology_detail_id:
                    normalizer: clinical_normalizer
                    type: keyword
                  submitter_id:
                    type: keyword
                type: nested
              primary_diagnosis:
                normalizer: clinical_normalizer
                type: keyword
              site_of_resection_or_biopsy:
                normalizer: clinical_normalizer
                type: keyword
              submitter_id:
                type: keyword
              tissue_or_organ_of_origin:
                normalizer: clinical_normalizer
                type: keyword
              treatments:
                properties:
                  submitter_id:
                    type: keyword
                  treatment_id:
                    normalizer: clinical_normalizer
                    type: keyword
                type: nested
            type: nested
          disease_type:
            normalizer: clinical_normalizer
            type: keyword
          exposures:
            properties:
              exposure_id:
                normalizer: clinical_normalizer
                type: keyword
              submitter_id:
                type: keyword
            type: nested
          family_histories:
            properties:
              family_history_id:
                normalizer: clinical_normalizer
                type: keyword
              submitter_id:
                type: keyword
            type: nested
          follow_ups:
            properties:
              days_to_follow_up:
                type: long
              follow_up_id:
                normalizer: clinical_normalizer
                type: keyword
              molecular_tests:
                properties:
                  gene_symbol:
                    normalizer: clinical_normalizer
                    type: keyword
                  molecular_analysis_method:
                    normalizer: clinical_normalizer
                    type: keyword
                  molecular_test_id:
                    normalizer: clinical_normalizer
                    type: keyword
                  submitter_id:
                    type: keyword
                  test_result:
                    normalizer: clinical_normalizer
                    type: keyword
                type: nested
              other_clinical_attributes:
                properties:
                  other_clinical_attribute_id:
                    normalizer: clinical_normalizer
                    type: keyword
                  submitter_id:
                    type: keyword
                type: nested
              submitter_id:
                type: keyword
            type: nested
          observation:
            properties:
              center:
                normalizer: clinical_normalizer
                type: keyword
              input_bam_file:
                properties:
                  normal_bam_uuid:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_bam_uuid:
                    normalizer: clinical_normalizer
                    type: keyword
              mutation_status:
                normalizer: clinical_normalizer
                type: keyword
              normal_genotype:
                properties:
                  match_norm_seq_allele1:
                    normalizer: clinical_normalizer
                    type: keyword
                  match_norm_seq_allele2:
                    normalizer: clinical_normalizer
                    type: keyword
              observation_id:
                normalizer: clinical_normalizer
                type: keyword
              read_depth:
                properties:
                  n_depth:
                    type: long
                  t_alt_count:
                    type: long
                  t_depth:
                    type: long
                  t_ref_count:
                    type: long
              sample:
                properties:
                  matched_norm_sample_barcode:
                    normalizer: clinical_normalizer
                    type: keyword
                  matched_norm_sample_uuid:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_sample_barcode:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_sample_uuid:
                    normalizer: clinical_normalizer
                    type: keyword
              tumor_genotype:
                properties:
                  tumor_seq_allele1:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_seq_allele2:
                    normalizer: clinical_normalizer
                    type: keyword
              validation:
                properties:
                  tumor_validation_allele1:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_validation_allele2:
                    normalizer: clinical_normalizer
                    type: keyword
                  validation_method:
                    normalizer: clinical_normalizer
                    type: keyword
              variant_calling:
                properties:
                  variant_caller:
                    normalizer: clinical_normalizer
                    type: keyword
                  variant_process:
                    normalizer: clinical_normalizer
                    type: keyword
            type: nested
          primary_site:
            normalizer: clinical_normalizer
            type: keyword
          project:
            properties:
              dbgap_accession_number:
                normalizer: clinical_normalizer
                type: keyword
              disease_type:
                normalizer: clinical_normalizer
                type: keyword
              intended_release_date:
                normalizer: clinical_normalizer
                type: keyword
              name:
                type: keyword
              primary_site:
                normalizer: clinical_normalizer
                type: keyword
              program:
                properties:
                  dbgap_accession_number:
                    normalizer: clinical_normalizer
                    type: keyword
                  name:
                    type: keyword
                  program_id:
                    normalizer: clinical_normalizer
                    type: keyword
              project_id:
                type: keyword
              releasable:
                normalizer: clinical_normalizer
                type: keyword
              released:
                normalizer: clinical_normalizer
                type: keyword
              state:
                normalizer: clinical_normalizer
                type: keyword
          samples:
            properties:
              portions:
                properties:
                  analytes:
                    properties:
                      aliquots:
                        properties:
                          aliquot_id:
                            normalizer: clinical_normalizer
                            type: keyword
                          submitter_id:
                            type: keyword
                        type: nested
                      analyte_id:
                        normalizer: clinical_normalizer
                        type: keyword
                      analyte_type:
                        normalizer: clinical_normalizer
                        type: keyword
                      submitter_id:
                        type: keyword
                    type: nested
                  portion_id:
                    normalizer: clinical_normalizer
                    type: keyword
                  slides:
                    properties:
                      section_location:
                        normalizer: clinical_normalizer
                        type: keyword
                      slide_id:
                        normalizer: clinical_normalizer
                        type: keyword
                      submitter_id:
                        type: keyword
                    type: nested
                  submitter_id:
                    type: keyword
                type: nested
              preservation_method:
                normalizer: clinical_normalizer
                type: keyword
              sample_id:
                normalizer: clinical_normalizer
                type: keyword
              specimen_type:
                normalizer: clinical_normalizer
                type: keyword
              submitter_id:
                type: keyword
              tissue_type:
                normalizer: clinical_normalizer
                type: keyword
              tumor_descriptor:
                normalizer: clinical_normalizer
                type: keyword
            type: nested
          submitter_id:
            type: keyword
          tissue_source_site:
            properties:
              tissue_source_site_id:
                normalizer: clinical_normalizer
                type: keyword
      occurrence_id:
        normalizer: clinical_normalizer
        type: keyword
    type: nested
  reference_allele:
    normalizer: clinical_normalizer
    type: keyword
  ssm_autocomplete:
    fields:
      analyzed:
        analyzer: autocomplete_analyzed
        search_analyzer: lowercase_keyword
        type: text
      lowercase:
        analyzer: lowercase_keyword
        type: text
      prefix:
        analyzer: autocomplete_prefix
        search_analyzer: lowercase_keyword
        type: text
    normalizer: clinical_normalizer
    type: keyword
  ssm_id:
    copy_to: *id001
    normalizer: clinical_normalizer
    type: keyword
  start_position:
    type: long
  tumor_allele:
    normalizer: clinical_normalizer
    type: keyword
