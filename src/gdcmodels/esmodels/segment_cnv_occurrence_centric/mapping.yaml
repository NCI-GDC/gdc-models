      length:
        type: long
      segment_cnv_id:
        copy_to:
          - segment_cnv_occurrence_autocomplete
        normalizer: clinical_normalizer
        type: keyword
      start_position:
        type: long
  segment_cnv_occurrence_autocomplete:
    fields:
      analyzed:
        analyzer: autocomplete_analyzed
        search_analyzer: lowercase_keyword
        type: text
      lowercase:
        analyzer: lowercase_keyword
        type: text
      prefix:
