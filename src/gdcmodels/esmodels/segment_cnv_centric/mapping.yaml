---
_size:
  enabled: true
_source:
  excludes:
    - __comment__
dynamic: strict
properties:
  chromosome:
    normalizer: clinical_normalizer
    type: keyword
  cnv_change:
    normalizer: clinical_normalizer
    type: keyword
  cnv_change_5_category:
    normalizer: clinical_normalizer
    type: keyword
  end_position:
    type: long
  length:
    type: long
  occurrence:
    properties:
      case:
        properties:
          available_variation_data:
            normalizer: clinical_normalizer
            type: keyword
          case_id:
            normalizer: clinical_normalizer
            type: keyword
          demographic:
            properties:
              demographic_id:
                normalizer: clinical_normalizer
                type: keyword
              ethnicity:
                normalizer: clinical_normalizer
                type: keyword
              race:
                normalizer: clinical_normalizer
                type: keyword
              sex_at_birth:
                normalizer: clinical_normalizer
                type: keyword
              submitter_id:
                type: keyword
              vital_status:
                normalizer: clinical_normalizer
                type: keyword
          diagnoses:
            properties:
              age_at_diagnosis:
                type: long
              diagnosis_id:
                normalizer: clinical_normalizer
                type: keyword
              diagnosis_is_primary_disease:
                normalizer: clinical_normalizer
                type: keyword
              morphology:
                normalizer: clinical_normalizer
                type: keyword
              pathology_details:
                properties:
                  pathology_detail_id:
                    normalizer: clinical_normalizer
                    type: keyword
                  submitter_id:
                    type: keyword
                type: nested
              primary_diagnosis:
                normalizer: clinical_normalizer
                type: keyword
              site_of_resection_or_biopsy:
                normalizer: clinical_normalizer
                type: keyword
              submitter_id:
                type: keyword
              tissue_or_organ_of_origin:
                normalizer: clinical_normalizer
                type: keyword
              treatments:
                properties:
                  submitter_id:
                    type: keyword
                  treatment_id:
                    normalizer: clinical_normalizer
                    type: keyword
                type: nested
            type: nested
          disease_type:
            normalizer: clinical_normalizer
            type: keyword
          exposures:
            properties:
              exposure_id:
                normalizer: clinical_normalizer
                type: keyword
              submitter_id:
                type: keyword
            type: nested
          family_histories:
            properties:
              family_history_id:
                normalizer: clinical_normalizer
                type: keyword
              submitter_id:
                type: keyword
            type: nested
          follow_ups:
            properties:
              days_to_follow_up:
                type: long
              follow_up_id:
                normalizer: clinical_normalizer
                type: keyword
              molecular_tests:
                properties:
                  gene_symbol:
                    normalizer: clinical_normalizer
                    type: keyword
                  molecular_analysis_method:
                    normalizer: clinical_normalizer
                    type: keyword
                  molecular_test_id:
                    normalizer: clinical_normalizer
                    type: keyword
                  submitter_id:
                    type: keyword
                  test_result:
                    normalizer: clinical_normalizer
                    type: keyword
                type: nested
              other_clinical_attributes:
                properties:
                  other_clinical_attribute_id:
                    normalizer: clinical_normalizer
                    type: keyword
                  submitter_id:
                    type: keyword
                type: nested
              submitter_id:
                type: keyword
            type: nested
          observation:
            properties:
              copy_number:
                type: integer
              observation_id:
                normalizer: clinical_normalizer
                type: keyword
              sample:
                properties:
                  tumor_sample_barcode:
                    normalizer: clinical_normalizer
                    type: keyword
                  tumor_sample_uuid:
                    normalizer: clinical_normalizer
                    type: keyword
              sample_ploidy_integer:
                type: integer
              src_file_id:
                normalizer: clinical_normalizer
                type: keyword
              variant_calling:
                properties:
                  variant_caller:
                    normalizer: clinical_normalizer
                    type: keyword
              variant_status:
                normalizer: clinical_normalizer
                type: keyword
            type: nested
          primary_site:
            normalizer: clinical_normalizer
            type: keyword
          project:
            properties:
              dbgap_accession_number:
                normalizer: clinical_normalizer
                type: keyword
              disease_type:
                normalizer: clinical_normalizer
                type: keyword
              intended_release_date:
                normalizer: clinical_normalizer
                type: keyword
              name:
                type: keyword
              primary_site:
                normalizer: clinical_normalizer
                type: keyword
              program:
                properties:
                  dbgap_accession_number:
                    normalizer: clinical_normalizer
                    type: keyword
                  name:
                    type: keyword
                  program_id:
                    normalizer: clinical_normalizer
                    type: keyword
              project_id:
                type: keyword
              releasable:
                normalizer: clinical_normalizer
                type: keyword
              released:
                normalizer: clinical_normalizer
                type: keyword
              state:
                normalizer: clinical_normalizer
                type: keyword
          samples:
            properties:
              portions:
                properties:
                  analytes:
                    properties:
                      aliquots:
                        properties:
                          aliquot_id:
                            normalizer: clinical_normalizer
                            type: keyword
                          submitter_id:
                            type: keyword
                        type: nested
                      analyte_id:
                        normalizer: clinical_normalizer
                        type: keyword
                      analyte_type:
                        normalizer: clinical_normalizer
                        type: keyword
                      submitter_id:
                        type: keyword
                    type: nested
                  portion_id:
                    normalizer: clinical_normalizer
                    type: keyword
                  slides:
                    properties:
                      section_location:
                        normalizer: clinical_normalizer
                        type: keyword
                      slide_id:
                        normalizer: clinical_normalizer
                        type: keyword
                      submitter_id:
                        type: keyword
                    type: nested
                  submitter_id:
                    type: keyword
                type: nested
              preservation_method:
                normalizer: clinical_normalizer
                type: keyword
              sample_id:
                normalizer: clinical_normalizer
                type: keyword
              specimen_type:
                normalizer: clinical_normalizer
                type: keyword
              submitter_id:
                type: keyword
              tissue_type:
                normalizer: clinical_normalizer
                type: keyword
              tumor_descriptor:
                normalizer: clinical_normalizer
                type: keyword
            type: nested
          submitter_id:
            type: keyword
          tissue_source_site:
            properties:
              tissue_source_site_id:
                normalizer: clinical_normalizer
                type: keyword
      occurrence_id:
        normalizer: clinical_normalizer
        type: keyword
    type: nested
  segment_cnv_autocomplete:
    fields:
      analyzed:
        analyzer: autocomplete_analyzed
        search_analyzer: lowercase_keyword
        type: text
      lowercase:
        analyzer: lowercase_keyword
        type: text
      prefix:
        analyzer: autocomplete_prefix
        search_analyzer: lowercase_keyword
        type: text
    normalizer: clinical_normalizer
    type: keyword
  segment_cnv_id:
    copy_to:
      - segment_cnv_autocomplete
    normalizer: clinical_normalizer
    type: keyword
  start_position:
    type: long
