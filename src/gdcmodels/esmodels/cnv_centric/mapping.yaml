  descriptions:
    cnvs.occurrence.case.consent_type: The text term used to describe the type of
      consent obtain from the subject for participation in the study.
    cnvs.occurrence.case.days_to_consent: Number of days between the date used for
      index and the date the subject consent was obtained for participation in the
      study.
    cnvs.occurrence.case.demographic.age_at_index: The patient's age (in years) on
      the reference or anchor date used during date obfuscation.
    cnvs.occurrence.case.demographic.age_is_obfuscated: The age or other properties
      related to the patient's age have been modified for compliance reasons. The
      actual age may differ from what was reported in order to comply with the Health
      Insurance Portability and Accountability Act (HIPAA).
    cnvs.occurrence.case.demographic.cause_of_death: Text term to identify the cause
      of death for a patient.
    cnvs.occurrence.case.demographic.days_to_birth: Number of days between the date
      used for index and the date from a person's date of birth represented as a calculated
      negative number of days.
    cnvs.occurrence.case.demographic.days_to_death: Number of days between the date
      used for index and the date from a person's date of death represented as a calculated
      number of days.
    cnvs.occurrence.case.demographic.ethnicity: An individual's self-described social
      and cultural grouping, specifically whether an individual describes themselves
      as Hispanic or Latino. The provided values are based on the categories defined
      by the U.S. Office of Management and Business and used by the U.S. Census Bureau.
    cnvs.occurrence.case.demographic.race: An arbitrary classification of a taxonomic
      group that is a division of a species. It usually arises as a consequence of
      geographical isolation within a species and is characterized by shared heredity,
      physical attributes and behavior, and in the case of humans, by common history,
      nationality, or geographic distribution. The provided values are based on the
      categories defined by the U.S. Office of Management and Business and used by
      the U.S. Census Bureau.
    cnvs.occurrence.case.demographic.sex_at_birth: A textual description of a person's
      sex at birth.
    cnvs.occurrence.case.demographic.state: The current state of the object.
    cnvs.occurrence.case.demographic.submitter_id: A project-specific identifier for
      a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    cnvs.occurrence.case.demographic.vital_status: The survival state of the person
      registered on the protocol.
    cnvs.occurrence.case.demographic.year_of_birth: Numeric value to represent the
      calendar year in which an individual was born.
    cnvs.occurrence.case.demographic.year_of_death: Numeric value to represent the
      year of the death of an individual.
    cnvs.occurrence.case.diagnoses.age_at_diagnosis: Age at the time of diagnosis
      expressed in number of days since birth.
    cnvs.occurrence.case.diagnoses.ajcc_clinical_m: Extent of the distant metastasis
      for the cancer based on evidence obtained from clinical assessment parameters
      determined prior to treatment.
    cnvs.occurrence.case.diagnoses.ajcc_clinical_n: Extent of the regional lymph node
      involvement for the cancer based on evidence obtained from clinical assessment
      parameters determined prior to treatment.
    cnvs.occurrence.case.diagnoses.ajcc_clinical_stage: Stage group determined from
      clinical information on the tumor (T), regional node (N) and metastases (M)
      and by grouping cases with similar prognosis for cancer.
    cnvs.occurrence.case.diagnoses.ajcc_clinical_t: Extent of the primary cancer based
      on evidence obtained from clinical assessment parameters determined prior to
      treatment.
    cnvs.occurrence.case.diagnoses.ajcc_pathologic_m: Code to represent the defined
      absence or presence of distant spread or metastases (M) to locations via vascular
      channels or lymphatics beyond the regional lymph nodes, using criteria established
      by the American Joint Committee on Cancer (AJCC).
    cnvs.occurrence.case.diagnoses.ajcc_pathologic_n: The codes that represent the
      stage of cancer based on the nodes present (N stage) according to criteria based
      on multiple editions of the AJCC's Cancer Staging Manual.
    cnvs.occurrence.case.diagnoses.ajcc_pathologic_stage: The extent of a cancer,
      especially whether the disease has spread from the original site to other parts
      of the body based on AJCC staging criteria.
    cnvs.occurrence.case.diagnoses.ajcc_pathologic_t: Code of pathological T (primary
      tumor) to define the size or contiguous extension of the primary tumor (T),
      using staging criteria from the American Joint Committee on Cancer (AJCC).
    cnvs.occurrence.case.diagnoses.ajcc_staging_system_edition: The text term used
      to describe the version or edition of the American Joint Committee on Cancer
      Staging Handbooks, a publication by the group formed for the purpose of developing
      a system of staging for cancer that is acceptable to the American medical profession
      and is compatible with other accepted classifications.
    cnvs.occurrence.case.diagnoses.ann_arbor_b_symptoms: Text term to signify whether
      lymphoma B-symptoms are present as noted in the patient's medical record.
    cnvs.occurrence.case.diagnoses.ann_arbor_clinical_stage: The text term used to
      describe the clinical classification of lymphoma, as defined by the Ann Arbor
      Lymphoma Staging System.
    cnvs.occurrence.case.diagnoses.ann_arbor_extranodal_involvement: Indicator that
      identifies whether a patient with malignant lymphoma has lymphomatous involvement
      of an extranodal site.
    cnvs.occurrence.case.diagnoses.ann_arbor_pathologic_stage: The text term used
      to describe the pathologic classification of lymphoma, as defined by the Ann
      Arbor Lymphoma Staging System.
    cnvs.occurrence.case.diagnoses.burkitt_lymphoma_clinical_variant: Burkitt's lymphoma
      categorization based on clinical features that differ from other forms of the
      same disease.
    cnvs.occurrence.case.diagnoses.classification_of_tumor: Text that describes the
      kind of disease present in the tumor specimen as related to a specific timepoint.
    cnvs.occurrence.case.diagnoses.cog_renal_stage: The text term used to describe
      the staging classification of renal tumors, as defined by the Children's Oncology
      Group (COG).
    cnvs.occurrence.case.diagnoses.days_to_diagnosis: Number of days between the date
      used for index and the date the patient was diagnosed with the malignant disease.
    cnvs.occurrence.case.diagnoses.days_to_last_follow_up: Time interval from the
      date of last follow up to the date of initial pathologic diagnosis, represented
      as a calculated number of days.
    cnvs.occurrence.case.diagnoses.days_to_last_known_disease_status: Number of days
      between the date used for index and the date the patient's disease status was
      known.
    cnvs.occurrence.case.diagnoses.days_to_recurrence: Number of days between the
      date used for index and the date the patient's disease recurred.
    cnvs.occurrence.case.diagnoses.diagnosis_is_primary_disease: Indicates whether
      this specific diagnosis represents the disease that was the primary focus of
      the study. Additionally, this diagnosis is reflected at the case level, which
      is captured using the case.disease_type property.
    cnvs.occurrence.case.diagnoses.esophageal_columnar_dysplasia_degree: Text term
      to describe the amount of dysplasia found within the benign esophageal columnar
      mucosa.
    cnvs.occurrence.case.diagnoses.esophageal_columnar_metaplasia_present: The yes/no/unknown
      indicator used to describe whether esophageal columnar metaplasia was determined
      to be present.
    cnvs.occurrence.case.diagnoses.figo_stage: The extent of a cervical or endometrial
      cancer within the body, especially whether the disease has spread from the original
      site to other parts of the body, as described by the International Federation
      of Gynecology and Obstetrics (FIGO) stages.
    cnvs.occurrence.case.diagnoses.figo_staging_edition_year: The text term used to
      describe the edition year of the FIGO staging system used to stage the patient's
      gynecologic tumor.
    cnvs.occurrence.case.diagnoses.gastric_esophageal_junction_involvement: The yes/no/unknown/not
      reported indicator used to describe whether the tumor is located across the
      gastroesophageal junction.
    cnvs.occurrence.case.diagnoses.goblet_cells_columnar_mucosa_present: The yes/no/unknown
      indicator used to describe whether goblet cells were determined to be present
      in the esophageal columnar mucosa.
    cnvs.occurrence.case.diagnoses.icd_10_code: Alphanumeric value used to describe
      the disease code from the tenth version of the International Classification
      of Disease (ICD-10).
    cnvs.occurrence.case.diagnoses.igcccg_stage: The text term used to describe the
      International Germ Cell Cancer Collaborative Group (IGCCCG), a grouping used
      to further classify metastatic testicular tumors.
    cnvs.occurrence.case.diagnoses.inss_stage: Text term used to describe the staging
      classification of neuroblastic tumors, as defined by the International Neuroblastoma
      Staging System (INSS).
    cnvs.occurrence.case.diagnoses.international_prognostic_index: The text term used
      to describe the International Prognostic Index, which classifies the prognosis
      of patients with aggressive non-Hodgkin's lymphoma.
    cnvs.occurrence.case.diagnoses.iss_stage: The multiple myeloma disease stage at
      diagnosis.
    cnvs.occurrence.case.diagnoses.last_known_disease_status: Text term that describes
      the last known state or condition of an individual's neoplasm.
    cnvs.occurrence.case.diagnoses.laterality: For tumors in paired organs, designates
      the side on which the cancer originates.
    cnvs.occurrence.case.diagnoses.masaoka_stage: The text term used to describe the
      Masaoka staging system, a classification that defines prognostic indicators
      for thymic malignancies and predicts tumor recurrence.
    cnvs.occurrence.case.diagnoses.metastasis_at_diagnosis: The text term used to
      describe the extent of metastatic disease present at diagnosis.
    cnvs.occurrence.case.diagnoses.method_of_diagnosis: Text term used to describe
      the method used to confirm the patients malignant diagnosis.
    cnvs.occurrence.case.diagnoses.morphology: The third edition of the International
      Classification of Diseases for Oncology, published in 2000 used principally
      in tumor and cancer registries for coding the site (topography) and the histology
      (morphology) of neoplasms. The study of the structure of the cells and their
      arrangement to constitute tissues and, finally, the association among these
      to form organs. In pathology, the microscopic process of identifying normal
      and abnormal morphologic characteristics in tissues, by employing various cytochemical
      and immunocytochemical stains. A system of numbered categories for representation
      of data.
    cnvs.occurrence.case.diagnoses.pathology_details.anaplasia_present: Yes/no/unknown/not
      reported indicator used to describe whether anaplasia was present at the time
      of diagnosis.
    cnvs.occurrence.case.diagnoses.pathology_details.anaplasia_present_type: The text
      term used to describe the morphologic findings indicating the presence of a
      malignant cellular infiltrate characterized by the presence of large pleomorphic
      cells, necrosis, and high mitotic activity in a tissue sample.
    cnvs.occurrence.case.diagnoses.pathology_details.bone_marrow_malignant_cells: The
      text term used to indicate whether there are malignant cells in the bone marrow.
    cnvs.occurrence.case.diagnoses.pathology_details.breslow_thickness: The number
      that describes the distance, in millimeters, between the upper layer of the
      epidermis and the deepest point of tumor penetration.
    cnvs.occurrence.case.diagnoses.pathology_details.circumferential_resection_margin: Numeric
      value used to describe the non-peritonealised bare area of rectum, comprising
      anterior and posterior segments, when submitted as a surgical specimen resulting
      from excision of cancer of the rectum.
    cnvs.occurrence.case.diagnoses.pathology_details.columnar_mucosa_present: Indicator
      noting whether columnar mucosa was present within the tissue.
    cnvs.occurrence.case.diagnoses.pathology_details.dysplasia_degree: The degree
      to which dysplasia was involved.
    cnvs.occurrence.case.diagnoses.pathology_details.dysplasia_type: The type of dysplasia
      involved.
    cnvs.occurrence.case.diagnoses.pathology_details.greatest_tumor_dimension: Numeric
      value that represents the measurement of the widest portion of the tumor in
      centimeters.
    cnvs.occurrence.case.diagnoses.pathology_details.gross_tumor_weight: Numeric value
      used to describe the gross pathologic tumor weight, measured in grams.
    cnvs.occurrence.case.diagnoses.pathology_details.largest_extrapelvic_peritoneal_focus: The
      text term used to describe the diameter of the largest focus originating outside
      of the pelvic peritoneal region.
    cnvs.occurrence.case.diagnoses.pathology_details.lymph_node_involved_site: The
      text term used to describe the anatomic site of lymph node involvement.
    cnvs.occurrence.case.diagnoses.pathology_details.lymph_node_involvement: Indicator
      noting whether lymph nodes were involved.
    cnvs.occurrence.case.diagnoses.pathology_details.lymph_nodes_positive: The number
      of lymph nodes involved with disease as determined by pathologic examination.
    cnvs.occurrence.case.diagnoses.pathology_details.lymph_nodes_tested: The number
      of lymph nodes tested to determine whether lymph nodes were involved with disease
      as determined by a pathologic examination.
    cnvs.occurrence.case.diagnoses.pathology_details.lymphatic_invasion_present: A
      yes/no indicator to ask if small or thin-walled vessel invasion is present,
      indicating lymphatic involvement
    cnvs.occurrence.case.diagnoses.pathology_details.margin_status: The determination
      of the presence of actual or potential neoplastic tissue which has been left
      outside the boundary of a resected specimen within the patient.
    cnvs.occurrence.case.diagnoses.pathology_details.metaplasia_present: Indicator
      noting whether metaplasia was present.
    cnvs.occurrence.case.diagnoses.pathology_details.morphologic_architectural_pattern: A
      specific morphologic or pathologic architectural pattern was discovered within
      the sample studied.
    cnvs.occurrence.case.diagnoses.pathology_details.non_nodal_regional_disease: The
      text term used to describe whether the patient had non-nodal regional disease.
    cnvs.occurrence.case.diagnoses.pathology_details.non_nodal_tumor_deposits: The
      yes/no/unknown indicator used to describe the presence of tumor deposits in
      the pericolic or perirectal fat or in adjacent mesentery away from the leading
      edge of the tumor.
    cnvs.occurrence.case.diagnoses.pathology_details.number_proliferating_cells: Numeric
      value that represents the count of proliferating cells determined during pathologic
      review of the sample slide(s).
    cnvs.occurrence.case.diagnoses.pathology_details.percent_tumor_invasion: The percentage
      of tumor cells spread locally in a malignant neoplasm through infiltration or
      destruction of adjacent tissue.
    cnvs.occurrence.case.diagnoses.pathology_details.perineural_invasion_present: a
      yes/no indicator to ask if perineural invasion or infiltration of tumor or cancer
      is present.
    cnvs.occurrence.case.diagnoses.pathology_details.peripancreatic_lymph_nodes_positive: Enumerated
      numeric value or range of values used to describe the number of peripancreatic
      lymph nodes determined to be positive.
    cnvs.occurrence.case.diagnoses.pathology_details.peripancreatic_lymph_nodes_tested: The
      total number of peripancreatic lymph nodes tested for the presence of pancreatic
      cancer cells.
    cnvs.occurrence.case.diagnoses.pathology_details.prostatic_chips_positive_count: The
      text term used to describe the number of positive prostatic chips, which are
      generated from transurethral resection of the prostate (TURP) procedures and
      are generally used for relieving urinary obstruction due to nodular hyperplasia
      of the prostate (benign prostatic hyperplasia).
    cnvs.occurrence.case.diagnoses.pathology_details.prostatic_chips_total_count: The
      text term used to describe the total number of prostatic chips, which are generated
      from transurethral resection of the prostate (TURP) procedures and are generally
      used for relieving urinary obstruction due to nodular hyperplasia of the prostate
      (benign prostatic hyperplasia).
    cnvs.occurrence.case.diagnoses.pathology_details.prostatic_involvement_percent: Numeric
      value that represents the percentage of prostatic involvement found in a specific
      tissue sample.
    cnvs.occurrence.case.diagnoses.pathology_details.state: The current state of the
      object.
    cnvs.occurrence.case.diagnoses.pathology_details.submitter_id: A project-specific
      identifier for a node. This property is the calling card/nickname/alias for
      a unit of submission. It can be used in place of the uuid for identifying or
      recalling a node.
    cnvs.occurrence.case.diagnoses.pathology_details.transglottic_extension: The text
      term used to describe an extension of the tumor beyond the opening into the
      ventricles and vocal cords.
    cnvs.occurrence.case.diagnoses.pathology_details.tumor_largest_dimension_diameter: Numeric
      value used to describe the maximum diameter or dimension of the primary tumor,
      measured in centimeters.
    cnvs.occurrence.case.diagnoses.pathology_details.vascular_invasion_present: The
      yes/no indicator to ask if large vessel or venous invasion was detected by surgery
      or presence in a tumor specimen.
    cnvs.occurrence.case.diagnoses.pathology_details.vascular_invasion_type: Text
      term that represents the type of vascular tumor invasion.
    cnvs.occurrence.case.diagnoses.primary_diagnosis: Text term used to describe the
      patient's histologic diagnosis, as described by the World Health Organization's
      (WHO) International Classification of Diseases for Oncology (ICD-O).
    cnvs.occurrence.case.diagnoses.primary_gleason_grade: The text term used to describe
      the primary Gleason score, which describes the pattern of cells making up the
      largest area of the tumor. The primary and secondary Gleason pattern grades
      are combined to determine the patient's Gleason grade group, which is used to
      determine the aggresiveness of prostate cancer. Note that this grade describes
      the entire prostatectomy specimen and is not specific to the sample used for
      sequencing.
    cnvs.occurrence.case.diagnoses.prior_malignancy: The yes/no/unknown indicator
      used to describe the patient's history of prior cancer diagnosis.
    cnvs.occurrence.case.diagnoses.prior_treatment: A yes/no/unknown/not applicable
      indicator related to the administration of therapeutic agents received before
      the body specimen was collected.
    cnvs.occurrence.case.diagnoses.progression_or_recurrence: Indicates whether a
      patient has a progression or recurrence after initial treatment. This can include
      local, regional, or metastatic disease.
    cnvs.occurrence.case.diagnoses.residual_disease: Tumor cells that remain in the
      body following cancer treatment.
    cnvs.occurrence.case.diagnoses.secondary_gleason_grade: The text term used to
      describe the secondary Gleason score, which describes the pattern of cells making
      up the second largest area of the tumor. The primary and secondary Gleason pattern
      grades are combined to determine the patient's Gleason grade group, which is
      used to determine the aggresiveness of prostate cancer. Note that this grade
      describes the entire prostatectomy specimen and is not specific to the sample
      used for sequencing.
    cnvs.occurrence.case.diagnoses.site_of_resection_or_biopsy: The text term used
      to describe the anatomic site of the resection or biopsy of the patient's malignant
      disease, as described by the World Health Organization's (WHO) International
      Classification of Diseases for Oncology (ICD-O).
    cnvs.occurrence.case.diagnoses.state: The current state of the object.
    cnvs.occurrence.case.diagnoses.submitter_id: A project-specific identifier for
      a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    cnvs.occurrence.case.diagnoses.synchronous_malignancy: A yes/no/unknown indicator
      used to describe whether the patient had an additional malignant diagnosis at
      the same time the tumor used for sequencing was diagnosed. If both tumors were
      sequenced, both tumors would have synchronous malignancies.
    cnvs.occurrence.case.diagnoses.tissue_or_organ_of_origin: The text term used to
      describe the anatomic site of origin, of the patient's malignant disease, as
      described by the World Health Organization's (WHO) International Classification
      of Diseases for Oncology (ICD-O).
    cnvs.occurrence.case.diagnoses.treatments.chemo_concurrent_to_radiation: The text
      term used to describe whether the patient was receiving chemotherapy concurrent
      to radiation.
    cnvs.occurrence.case.diagnoses.treatments.days_to_treatment_end: Number of days
      between the date used for index and the date the treatment ended.
    cnvs.occurrence.case.diagnoses.treatments.days_to_treatment_start: Number of days
      between the date used for index and the date the treatment started.
    cnvs.occurrence.case.diagnoses.treatments.initial_disease_status: The text term
      used to describe the status of the patient's malignancy when the treatment began.
    cnvs.occurrence.case.diagnoses.treatments.number_of_cycles: The numeric value
      used to describe the number of cycles of a specific treatment or regimen the
      patient received.
    cnvs.occurrence.case.diagnoses.treatments.regimen_or_line_of_therapy: The text
      term used to describe the regimen or line of therapy.
    cnvs.occurrence.case.diagnoses.treatments.state: The current state of the object.
    cnvs.occurrence.case.diagnoses.treatments.submitter_id: A project-specific identifier
      for a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    cnvs.occurrence.case.diagnoses.treatments.therapeutic_agents: Text identification
      of the individual agent(s) used as part of a treatment regimen.
    cnvs.occurrence.case.diagnoses.treatments.treatment_dose: The numeric value used
      to describe the total dose of an agent the patient received.
    cnvs.occurrence.case.diagnoses.treatments.treatment_frequency: The text term used
      to describe the frequency the patient received an agent or regimen.
    cnvs.occurrence.case.diagnoses.treatments.treatment_intent_type: Text term to
      identify the reason for the administration of a treatment regimen. [Manually-curated]
    cnvs.occurrence.case.diagnoses.treatments.treatment_or_therapy: An indicator related
      to the administration of the treatment specified in the treatment_type field.
    cnvs.occurrence.case.diagnoses.treatments.treatment_outcome: Text term that describes
      the patient's final outcome after the treatment was administered.
    cnvs.occurrence.case.diagnoses.treatments.treatment_type: Text term that describes
      the type of treatment information available within this dataset. Note the value
      of this field may not be an indication that the treatment type was administered
      to this patient. Please reference the treatment_or_therapy property where it
      is indicated whether the patient received this treatment type.
    cnvs.occurrence.case.diagnoses.treatments.treatment_type_administered: Text term
      that describes the kind of treatment administered to a patient.
    cnvs.occurrence.case.diagnoses.tumor_grade: Numeric value to express the degree
      of abnormality of cancer cells, a measure of differentiation and aggressiveness.
    cnvs.occurrence.case.diagnoses.year_of_diagnosis: Numeric value to represent the
      year of an individual's initial pathologic diagnosis of cancer.
    cnvs.occurrence.case.disease_type: The text term used to describe the type of
      malignant disease, as categorized by the World Health Organization's (WHO) International
      Classification of Diseases for Oncology (ICD-O).
    cnvs.occurrence.case.exposures.alcohol_days_per_week: Numeric value used to describe
      the average number of days each week that a person consumes an alcoholic beverage.
    cnvs.occurrence.case.exposures.alcohol_history: A response to a question that
      asks whether the participant has consumed at least 12 drinks of any kind of
      alcoholic beverage in their lifetime.
    cnvs.occurrence.case.exposures.alcohol_intensity: Category to describe the patient's
      current level of alcohol use as self-reported by the patient.
    cnvs.occurrence.case.exposures.cigarettes_per_day: The average number of cigarettes
      smoked per day.
    cnvs.occurrence.case.exposures.pack_years_smoked: Numeric computed value to represent
      lifetime tobacco exposure defined as number of cigarettes smoked per day x number
      of years smoked divided by 20.
    cnvs.occurrence.case.exposures.state: The current state of the object.
    cnvs.occurrence.case.exposures.submitter_id: A project-specific identifier for
      a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    cnvs.occurrence.case.exposures.tobacco_smoking_onset_year: The year in which the
      participant began smoking.
    cnvs.occurrence.case.exposures.tobacco_smoking_quit_year: The year in which the
      participant quit smoking.
    cnvs.occurrence.case.exposures.tobacco_smoking_status: Category describing current
      smoking status and smoking history as self-reported by a patient.
    cnvs.occurrence.case.family_histories.relationship_age_at_diagnosis: The age (in
      years) when the patient's relative was first diagnosed.
    cnvs.occurrence.case.family_histories.relationship_primary_diagnosis: The text
      term used to describe the malignant diagnosis of the patient's relative with
      a history of cancer.
    cnvs.occurrence.case.family_histories.relationship_type: The subgroup that describes
      the state of connectedness between members of the unit of society organized
      around kinship ties.
    cnvs.occurrence.case.family_histories.relative_with_cancer_history: The yes/no/unknown
      indicator used to describe whether any of the patient's relatives have a history
      of cancer.
    cnvs.occurrence.case.family_histories.state: The current state of the object.
    cnvs.occurrence.case.family_histories.submitter_id: A project-specific identifier
      for a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    cnvs.occurrence.case.follow_ups.days_to_follow_up: Number of days between the
      date used for index and the date of the patient's last follow-up appointment
      or contact.
    cnvs.occurrence.case.follow_ups.molecular_tests.gene_symbol: The text term used
      to describe a gene targeted or included in molecular analysis. For rearrangements,
      this should be used to represent the reference gene.
    cnvs.occurrence.case.follow_ups.molecular_tests.molecular_analysis_method: The
      text term used to describe the method used for molecular analysis.
    cnvs.occurrence.case.follow_ups.molecular_tests.submitter_id: A project-specific
      identifier for a node. This property is the calling card/nickname/alias for
      a unit of submission. It can be used in place of the uuid for identifying or
      recalling a node.
    cnvs.occurrence.case.follow_ups.molecular_tests.test_result: The text term used
      to describe the result of the molecular test. If the test result was a numeric
      value see test_value.
    cnvs.occurrence.case.follow_ups.other_clinical_attributes.submitter_id: A project-specific
      identifier for a node. This property is the calling card/nickname/alias for
      a unit of submission. It can be used in place of the uuid for identifying or
      recalling a node.
    cnvs.occurrence.case.follow_ups.submitter_id: A project-specific identifier for
      a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    cnvs.occurrence.case.index_date: The text term used to describe the reference
      or anchor date used when for date obfuscation, where a single date is obscurred
      by creating one or more date ranges in relation to this date.
    cnvs.occurrence.case.lost_to_followup: The yes/no/unknown indicator used to describe
      whether a patient was unable to be contacted or seen for follow-up information.
    cnvs.occurrence.case.primary_site: The text term used to describe the primary
      site of disease, as categorized by the World Health Organization's (WHO) International
      Classification of Diseases for Oncology (ICD-O). This categorization groups
      cases into general categories. Reference tissue_or_organ_of_origin on the diagnosis
      node for more specific primary sites of disease.
    cnvs.occurrence.case.project.dbgap_accession_number: The dbgap accession number
      for the project.
    cnvs.occurrence.case.project.disease_type: Full name for the project
    cnvs.occurrence.case.project.id: UUID for the project
    cnvs.occurrence.case.project.intended_release_date: Tracks a Project's intended
      release date.
    cnvs.occurrence.case.project.name: Display name for the project
    cnvs.occurrence.case.project.primary_site: Primary site for the project
    cnvs.occurrence.case.project.program.dbgap_accession_number: The dbgap accession
      number provided for the program.
    cnvs.occurrence.case.project.program.id: A 128-bit identifier. Depending on the
      mechanism used to generate it, it is either guaranteed to be different from
      all other UUIDs/GUIDs generated until 3400 AD or extremely likely to be different.
      Its relatively small size lends itself well to sorting, ordering, and hashing
      of all sorts, storing in databases, simple allocation, and ease of programming
      in general.
    cnvs.occurrence.case.project.program.name: Full name/title of the program.
    cnvs.occurrence.case.project.releasable: A project can only be released by the
      user when `releasable` is true.
    cnvs.occurrence.case.project.released: To release a project is to tell the GDC
      to include all submitted entities in the next GDC index.
    cnvs.occurrence.case.project.state: The possible states a project can be in.  All
      but `open` are equivalent to some type of locked state.
    cnvs.occurrence.case.samples.portions.analytes.aliquots.submitter_id: A project-specific
      identifier for a node. This property is the calling card/nickname/alias for
      a unit of submission. It can be used in place of the uuid for identifying or
      recalling a node.
    cnvs.occurrence.case.samples.portions.analytes.analyte_type: Text term that represents
