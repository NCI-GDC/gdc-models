  descriptions:
    ssm_occurrences.case.consent_type: The text term used to describe the type of
      consent obtain from the subject for participation in the study.
    ssm_occurrences.case.days_to_consent: Number of days between the date used for
      index and the date the subject consent was obtained for participation in the
      study.
    ssm_occurrences.case.demographic.age_at_index: The patient's age (in years) on
      the reference or anchor date used during date obfuscation.
    ssm_occurrences.case.demographic.age_is_obfuscated: The age or other properties
      related to the patient's age have been modified for compliance reasons. The
      actual age may differ from what was reported in order to comply with the Health
      Insurance Portability and Accountability Act (HIPAA).
    ssm_occurrences.case.demographic.cause_of_death: Text term to identify the cause
      of death for a patient.
    ssm_occurrences.case.demographic.days_to_birth: Number of days between the date
      used for index and the date from a person's date of birth represented as a calculated
      negative number of days.
    ssm_occurrences.case.demographic.days_to_death: Number of days between the date
      used for index and the date from a person's date of death represented as a calculated
      number of days.
    ssm_occurrences.case.demographic.ethnicity: An individual's self-described social
      and cultural grouping, specifically whether an individual describes themselves
      as Hispanic or Latino. The provided values are based on the categories defined
      by the U.S. Office of Management and Business and used by the U.S. Census Bureau.
    ssm_occurrences.case.demographic.race: An arbitrary classification of a taxonomic
      group that is a division of a species. It usually arises as a consequence of
      geographical isolation within a species and is characterized by shared heredity,
      physical attributes and behavior, and in the case of humans, by common history,
      nationality, or geographic distribution. The provided values are based on the
      categories defined by the U.S. Office of Management and Business and used by
      the U.S. Census Bureau.
    ssm_occurrences.case.demographic.sex_at_birth: A textual description of a person's
      sex at birth.
    ssm_occurrences.case.demographic.state: The current state of the object.
    ssm_occurrences.case.demographic.submitter_id: A project-specific identifier for
      a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    ssm_occurrences.case.demographic.vital_status: The survival state of the person
      registered on the protocol.
    ssm_occurrences.case.demographic.year_of_birth: Numeric value to represent the
      calendar year in which an individual was born.
    ssm_occurrences.case.demographic.year_of_death: Numeric value to represent the
      year of the death of an individual.
    ssm_occurrences.case.diagnoses.age_at_diagnosis: Age at the time of diagnosis
      expressed in number of days since birth.
    ssm_occurrences.case.diagnoses.ajcc_clinical_m: Extent of the distant metastasis
      for the cancer based on evidence obtained from clinical assessment parameters
      determined prior to treatment.
    ssm_occurrences.case.diagnoses.ajcc_clinical_n: Extent of the regional lymph node
      involvement for the cancer based on evidence obtained from clinical assessment
      parameters determined prior to treatment.
    ssm_occurrences.case.diagnoses.ajcc_clinical_stage: Stage group determined from
      clinical information on the tumor (T), regional node (N) and metastases (M)
      and by grouping cases with similar prognosis for cancer.
    ssm_occurrences.case.diagnoses.ajcc_clinical_t: Extent of the primary cancer based
      on evidence obtained from clinical assessment parameters determined prior to
      treatment.
    ssm_occurrences.case.diagnoses.ajcc_pathologic_m: Code to represent the defined
      absence or presence of distant spread or metastases (M) to locations via vascular
      channels or lymphatics beyond the regional lymph nodes, using criteria established
      by the American Joint Committee on Cancer (AJCC).
    ssm_occurrences.case.diagnoses.ajcc_pathologic_n: The codes that represent the
      stage of cancer based on the nodes present (N stage) according to criteria based
      on multiple editions of the AJCC's Cancer Staging Manual.
    ssm_occurrences.case.diagnoses.ajcc_pathologic_stage: The extent of a cancer,
      especially whether the disease has spread from the original site to other parts
      of the body based on AJCC staging criteria.
    ssm_occurrences.case.diagnoses.ajcc_pathologic_t: Code of pathological T (primary
      tumor) to define the size or contiguous extension of the primary tumor (T),
      using staging criteria from the American Joint Committee on Cancer (AJCC).
    ssm_occurrences.case.diagnoses.ajcc_staging_system_edition: The text term used
      to describe the version or edition of the American Joint Committee on Cancer
      Staging Handbooks, a publication by the group formed for the purpose of developing
      a system of staging for cancer that is acceptable to the American medical profession
      and is compatible with other accepted classifications.
    ssm_occurrences.case.diagnoses.ann_arbor_b_symptoms: Text term to signify whether
      lymphoma B-symptoms are present as noted in the patient's medical record.
    ssm_occurrences.case.diagnoses.ann_arbor_clinical_stage: The text term used to
      describe the clinical classification of lymphoma, as defined by the Ann Arbor
      Lymphoma Staging System.
    ssm_occurrences.case.diagnoses.ann_arbor_extranodal_involvement: Indicator that
      identifies whether a patient with malignant lymphoma has lymphomatous involvement
      of an extranodal site.
    ssm_occurrences.case.diagnoses.ann_arbor_pathologic_stage: The text term used
      to describe the pathologic classification of lymphoma, as defined by the Ann
      Arbor Lymphoma Staging System.
    ssm_occurrences.case.diagnoses.burkitt_lymphoma_clinical_variant: Burkitt's lymphoma
      categorization based on clinical features that differ from other forms of the
      same disease.
    ssm_occurrences.case.diagnoses.classification_of_tumor: Text that describes the
      kind of disease present in the tumor specimen as related to a specific timepoint.
    ssm_occurrences.case.diagnoses.cog_renal_stage: The text term used to describe
      the staging classification of renal tumors, as defined by the Children's Oncology
      Group (COG).
    ssm_occurrences.case.diagnoses.days_to_diagnosis: Number of days between the date
      used for index and the date the patient was diagnosed with the malignant disease.
    ssm_occurrences.case.diagnoses.days_to_last_follow_up: Time interval from the
      date of last follow up to the date of initial pathologic diagnosis, represented
      as a calculated number of days.
    ssm_occurrences.case.diagnoses.days_to_last_known_disease_status: Number of days
      between the date used for index and the date the patient's disease status was
      known.
    ssm_occurrences.case.diagnoses.days_to_recurrence: Number of days between the
      date used for index and the date the patient's disease recurred.
    ssm_occurrences.case.diagnoses.diagnosis_is_primary_disease: Indicates whether
      this specific diagnosis represents the disease that was the primary focus of
      the study. Additionally, this diagnosis is reflected at the case level, which
      is captured using the case.disease_type property.
    ssm_occurrences.case.diagnoses.esophageal_columnar_dysplasia_degree: Text term
      to describe the amount of dysplasia found within the benign esophageal columnar
      mucosa.
    ssm_occurrences.case.diagnoses.esophageal_columnar_metaplasia_present: The yes/no/unknown
      indicator used to describe whether esophageal columnar metaplasia was determined
      to be present.
    ssm_occurrences.case.diagnoses.figo_stage: The extent of a cervical or endometrial
      cancer within the body, especially whether the disease has spread from the original
      site to other parts of the body, as described by the International Federation
      of Gynecology and Obstetrics (FIGO) stages.
    ssm_occurrences.case.diagnoses.figo_staging_edition_year: The text term used to
      describe the edition year of the FIGO staging system used to stage the patient's
      gynecologic tumor.
    ssm_occurrences.case.diagnoses.gastric_esophageal_junction_involvement: The yes/no/unknown/not
      reported indicator used to describe whether the tumor is located across the
      gastroesophageal junction.
    ssm_occurrences.case.diagnoses.goblet_cells_columnar_mucosa_present: The yes/no/unknown
      indicator used to describe whether goblet cells were determined to be present
      in the esophageal columnar mucosa.
    ssm_occurrences.case.diagnoses.icd_10_code: Alphanumeric value used to describe
      the disease code from the tenth version of the International Classification
      of Disease (ICD-10).
    ssm_occurrences.case.diagnoses.igcccg_stage: The text term used to describe the
      International Germ Cell Cancer Collaborative Group (IGCCCG), a grouping used
      to further classify metastatic testicular tumors.
    ssm_occurrences.case.diagnoses.inss_stage: Text term used to describe the staging
      classification of neuroblastic tumors, as defined by the International Neuroblastoma
      Staging System (INSS).
    ssm_occurrences.case.diagnoses.international_prognostic_index: The text term used
      to describe the International Prognostic Index, which classifies the prognosis
      of patients with aggressive non-Hodgkin's lymphoma.
    ssm_occurrences.case.diagnoses.iss_stage: The multiple myeloma disease stage at
      diagnosis.
    ssm_occurrences.case.diagnoses.last_known_disease_status: Text term that describes
      the last known state or condition of an individual's neoplasm.
    ssm_occurrences.case.diagnoses.laterality: For tumors in paired organs, designates
      the side on which the cancer originates.
    ssm_occurrences.case.diagnoses.masaoka_stage: The text term used to describe the
      Masaoka staging system, a classification that defines prognostic indicators
      for thymic malignancies and predicts tumor recurrence.
    ssm_occurrences.case.diagnoses.metastasis_at_diagnosis: The text term used to
      describe the extent of metastatic disease present at diagnosis.
    ssm_occurrences.case.diagnoses.method_of_diagnosis: Text term used to describe
      the method used to confirm the patients malignant diagnosis.
    ssm_occurrences.case.diagnoses.morphology: The third edition of the International
      Classification of Diseases for Oncology, published in 2000 used principally
      in tumor and cancer registries for coding the site (topography) and the histology
      (morphology) of neoplasms. The study of the structure of the cells and their
      arrangement to constitute tissues and, finally, the association among these
      to form organs. In pathology, the microscopic process of identifying normal
      and abnormal morphologic characteristics in tissues, by employing various cytochemical
      and immunocytochemical stains. A system of numbered categories for representation
      of data.
    ssm_occurrences.case.diagnoses.pathology_details.anaplasia_present: Yes/no/unknown/not
      reported indicator used to describe whether anaplasia was present at the time
      of diagnosis.
    ssm_occurrences.case.diagnoses.pathology_details.anaplasia_present_type: The text
      term used to describe the morphologic findings indicating the presence of a
      malignant cellular infiltrate characterized by the presence of large pleomorphic
      cells, necrosis, and high mitotic activity in a tissue sample.
    ssm_occurrences.case.diagnoses.pathology_details.bone_marrow_malignant_cells: The
      text term used to indicate whether there are malignant cells in the bone marrow.
    ssm_occurrences.case.diagnoses.pathology_details.breslow_thickness: The number
      that describes the distance, in millimeters, between the upper layer of the
      epidermis and the deepest point of tumor penetration.
    ssm_occurrences.case.diagnoses.pathology_details.circumferential_resection_margin: Numeric
      value used to describe the non-peritonealised bare area of rectum, comprising
      anterior and posterior segments, when submitted as a surgical specimen resulting
      from excision of cancer of the rectum.
    ssm_occurrences.case.diagnoses.pathology_details.columnar_mucosa_present: Indicator
      noting whether columnar mucosa was present within the tissue.
    ssm_occurrences.case.diagnoses.pathology_details.dysplasia_degree: The degree
      to which dysplasia was involved.
    ssm_occurrences.case.diagnoses.pathology_details.dysplasia_type: The type of dysplasia
      involved.
    ssm_occurrences.case.diagnoses.pathology_details.greatest_tumor_dimension: Numeric
      value that represents the measurement of the widest portion of the tumor in
      centimeters.
    ssm_occurrences.case.diagnoses.pathology_details.gross_tumor_weight: Numeric value
      used to describe the gross pathologic tumor weight, measured in grams.
    ssm_occurrences.case.diagnoses.pathology_details.largest_extrapelvic_peritoneal_focus: The
      text term used to describe the diameter of the largest focus originating outside
      of the pelvic peritoneal region.
    ssm_occurrences.case.diagnoses.pathology_details.lymph_node_involved_site: The
      text term used to describe the anatomic site of lymph node involvement.
    ssm_occurrences.case.diagnoses.pathology_details.lymph_node_involvement: Indicator
      noting whether lymph nodes were involved.
    ssm_occurrences.case.diagnoses.pathology_details.lymph_nodes_positive: The number
      of lymph nodes involved with disease as determined by pathologic examination.
    ssm_occurrences.case.diagnoses.pathology_details.lymph_nodes_tested: The number
      of lymph nodes tested to determine whether lymph nodes were involved with disease
      as determined by a pathologic examination.
    ssm_occurrences.case.diagnoses.pathology_details.lymphatic_invasion_present: A
      yes/no indicator to ask if small or thin-walled vessel invasion is present,
      indicating lymphatic involvement
    ssm_occurrences.case.diagnoses.pathology_details.margin_status: The determination
      of the presence of actual or potential neoplastic tissue which has been left
      outside the boundary of a resected specimen within the patient.
    ssm_occurrences.case.diagnoses.pathology_details.metaplasia_present: Indicator
      noting whether metaplasia was present.
    ssm_occurrences.case.diagnoses.pathology_details.morphologic_architectural_pattern: A
      specific morphologic or pathologic architectural pattern was discovered within
      the sample studied.
    ssm_occurrences.case.diagnoses.pathology_details.non_nodal_regional_disease: The
      text term used to describe whether the patient had non-nodal regional disease.
    ssm_occurrences.case.diagnoses.pathology_details.non_nodal_tumor_deposits: The
      yes/no/unknown indicator used to describe the presence of tumor deposits in
      the pericolic or perirectal fat or in adjacent mesentery away from the leading
      edge of the tumor.
    ssm_occurrences.case.diagnoses.pathology_details.number_proliferating_cells: Numeric
      value that represents the count of proliferating cells determined during pathologic
      review of the sample slide(s).
    ssm_occurrences.case.diagnoses.pathology_details.percent_tumor_invasion: The percentage
      of tumor cells spread locally in a malignant neoplasm through infiltration or
      destruction of adjacent tissue.
    ssm_occurrences.case.diagnoses.pathology_details.perineural_invasion_present: a
      yes/no indicator to ask if perineural invasion or infiltration of tumor or cancer
      is present.
    ssm_occurrences.case.diagnoses.pathology_details.peripancreatic_lymph_nodes_positive: Enumerated
      numeric value or range of values used to describe the number of peripancreatic
      lymph nodes determined to be positive.
    ssm_occurrences.case.diagnoses.pathology_details.peripancreatic_lymph_nodes_tested: The
      total number of peripancreatic lymph nodes tested for the presence of pancreatic
      cancer cells.
    ssm_occurrences.case.diagnoses.pathology_details.prostatic_chips_positive_count: The
      text term used to describe the number of positive prostatic chips, which are
      generated from transurethral resection of the prostate (TURP) procedures and
      are generally used for relieving urinary obstruction due to nodular hyperplasia
      of the prostate (benign prostatic hyperplasia).
    ssm_occurrences.case.diagnoses.pathology_details.prostatic_chips_total_count: The
      text term used to describe the total number of prostatic chips, which are generated
      from transurethral resection of the prostate (TURP) procedures and are generally
      used for relieving urinary obstruction due to nodular hyperplasia of the prostate
      (benign prostatic hyperplasia).
    ssm_occurrences.case.diagnoses.pathology_details.prostatic_involvement_percent: Numeric
      value that represents the percentage of prostatic involvement found in a specific
      tissue sample.
    ssm_occurrences.case.diagnoses.pathology_details.state: The current state of the
      object.
    ssm_occurrences.case.diagnoses.pathology_details.submitter_id: A project-specific
      identifier for a node. This property is the calling card/nickname/alias for
      a unit of submission. It can be used in place of the uuid for identifying or
      recalling a node.
    ssm_occurrences.case.diagnoses.pathology_details.transglottic_extension: The text
      term used to describe an extension of the tumor beyond the opening into the
      ventricles and vocal cords.
    ssm_occurrences.case.diagnoses.pathology_details.tumor_largest_dimension_diameter: Numeric
      value used to describe the maximum diameter or dimension of the primary tumor,
      measured in centimeters.
    ssm_occurrences.case.diagnoses.pathology_details.vascular_invasion_present: The
      yes/no indicator to ask if large vessel or venous invasion was detected by surgery
      or presence in a tumor specimen.
    ssm_occurrences.case.diagnoses.pathology_details.vascular_invasion_type: Text
      term that represents the type of vascular tumor invasion.
    ssm_occurrences.case.diagnoses.primary_diagnosis: Text term used to describe the
      patient's histologic diagnosis, as described by the World Health Organization's
      (WHO) International Classification of Diseases for Oncology (ICD-O).
    ssm_occurrences.case.diagnoses.primary_gleason_grade: The text term used to describe
      the primary Gleason score, which describes the pattern of cells making up the
      largest area of the tumor. The primary and secondary Gleason pattern grades
      are combined to determine the patient's Gleason grade group, which is used to
      determine the aggresiveness of prostate cancer. Note that this grade describes
      the entire prostatectomy specimen and is not specific to the sample used for
      sequencing.
    ssm_occurrences.case.diagnoses.prior_malignancy: The yes/no/unknown indicator
      used to describe the patient's history of prior cancer diagnosis.
    ssm_occurrences.case.diagnoses.prior_treatment: A yes/no/unknown/not applicable
      indicator related to the administration of therapeutic agents received before
      the body specimen was collected.
    ssm_occurrences.case.diagnoses.progression_or_recurrence: Indicates whether a
      patient has a progression or recurrence after initial treatment. This can include
      local, regional, or metastatic disease.
    ssm_occurrences.case.diagnoses.residual_disease: Tumor cells that remain in the
      body following cancer treatment.
    ssm_occurrences.case.diagnoses.secondary_gleason_grade: The text term used to
      describe the secondary Gleason score, which describes the pattern of cells making
      up the second largest area of the tumor. The primary and secondary Gleason pattern
      grades are combined to determine the patient's Gleason grade group, which is
      used to determine the aggresiveness of prostate cancer. Note that this grade
      describes the entire prostatectomy specimen and is not specific to the sample
      used for sequencing.
    ssm_occurrences.case.diagnoses.site_of_resection_or_biopsy: The text term used
      to describe the anatomic site of the resection or biopsy of the patient's malignant
      disease, as described by the World Health Organization's (WHO) International
      Classification of Diseases for Oncology (ICD-O).
    ssm_occurrences.case.diagnoses.state: The current state of the object.
    ssm_occurrences.case.diagnoses.submitter_id: A project-specific identifier for
      a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    ssm_occurrences.case.diagnoses.synchronous_malignancy: A yes/no/unknown indicator
      used to describe whether the patient had an additional malignant diagnosis at
      the same time the tumor used for sequencing was diagnosed. If both tumors were
      sequenced, both tumors would have synchronous malignancies.
    ssm_occurrences.case.diagnoses.tissue_or_organ_of_origin: The text term used to
      describe the anatomic site of origin, of the patient's malignant disease, as
      described by the World Health Organization's (WHO) International Classification
      of Diseases for Oncology (ICD-O).
    ssm_occurrences.case.diagnoses.treatments.chemo_concurrent_to_radiation: The text
      term used to describe whether the patient was receiving chemotherapy concurrent
      to radiation.
    ssm_occurrences.case.diagnoses.treatments.days_to_treatment_end: Number of days
      between the date used for index and the date the treatment ended.
    ssm_occurrences.case.diagnoses.treatments.days_to_treatment_start: Number of days
      between the date used for index and the date the treatment started.
    ssm_occurrences.case.diagnoses.treatments.initial_disease_status: The text term
      used to describe the status of the patient's malignancy when the treatment began.
    ssm_occurrences.case.diagnoses.treatments.number_of_cycles: The numeric value
      used to describe the number of cycles of a specific treatment or regimen the
      patient received.
    ssm_occurrences.case.diagnoses.treatments.regimen_or_line_of_therapy: The text
      term used to describe the regimen or line of therapy.
    ssm_occurrences.case.diagnoses.treatments.state: The current state of the object.
    ssm_occurrences.case.diagnoses.treatments.submitter_id: A project-specific identifier
      for a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    ssm_occurrences.case.diagnoses.treatments.therapeutic_agents: Text identification
      of the individual agent(s) used as part of a treatment regimen.
    ssm_occurrences.case.diagnoses.treatments.treatment_dose: The numeric value used
      to describe the total dose of an agent the patient received.
    ssm_occurrences.case.diagnoses.treatments.treatment_frequency: The text term used
      to describe the frequency the patient received an agent or regimen.
    ssm_occurrences.case.diagnoses.treatments.treatment_intent_type: Text term to
      identify the reason for the administration of a treatment regimen. [Manually-curated]
    ssm_occurrences.case.diagnoses.treatments.treatment_or_therapy: An indicator related
      to the administration of the treatment specified in the treatment_type field.
    ssm_occurrences.case.diagnoses.treatments.treatment_outcome: Text term that describes
      the patient's final outcome after the treatment was administered.
    ssm_occurrences.case.diagnoses.treatments.treatment_type: Text term that describes
      the type of treatment information available within this dataset. Note the value
      of this field may not be an indication that the treatment type was administered
      to this patient. Please reference the treatment_or_therapy property where it
      is indicated whether the patient received this treatment type.
    ssm_occurrences.case.diagnoses.treatments.treatment_type_administered: Text term
      that describes the kind of treatment administered to a patient.
    ssm_occurrences.case.diagnoses.tumor_grade: Numeric value to express the degree
      of abnormality of cancer cells, a measure of differentiation and aggressiveness.
    ssm_occurrences.case.diagnoses.year_of_diagnosis: Numeric value to represent the
      year of an individual's initial pathologic diagnosis of cancer.
    ssm_occurrences.case.disease_type: The text term used to describe the type of
      malignant disease, as categorized by the World Health Organization's (WHO) International
      Classification of Diseases for Oncology (ICD-O).
    ssm_occurrences.case.exposures.alcohol_days_per_week: Numeric value used to describe
      the average number of days each week that a person consumes an alcoholic beverage.
    ssm_occurrences.case.exposures.alcohol_history: A response to a question that
      asks whether the participant has consumed at least 12 drinks of any kind of
      alcoholic beverage in their lifetime.
    ssm_occurrences.case.exposures.alcohol_intensity: Category to describe the patient's
