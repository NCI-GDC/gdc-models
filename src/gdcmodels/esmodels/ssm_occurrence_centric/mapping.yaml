    ssm_occurrences.case.exposures.cigarettes_per_day: The average number of cigarettes
      smoked per day.
    ssm_occurrences.case.exposures.pack_years_smoked: Numeric computed value to represent
      lifetime tobacco exposure defined as number of cigarettes smoked per day x number
      of years smoked divided by 20.
    ssm_occurrences.case.exposures.state: The current state of the object.
    ssm_occurrences.case.exposures.submitter_id: A project-specific identifier for
      a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    ssm_occurrences.case.exposures.tobacco_smoking_onset_year: The year in which the
      participant began smoking.
    ssm_occurrences.case.exposures.tobacco_smoking_quit_year: The year in which the
      participant quit smoking.
    ssm_occurrences.case.exposures.tobacco_smoking_status: Category describing current
      smoking status and smoking history as self-reported by a patient.
    ssm_occurrences.case.family_histories.relationship_age_at_diagnosis: The age (in
      years) when the patient's relative was first diagnosed.
    ssm_occurrences.case.family_histories.relationship_primary_diagnosis: The text
      term used to describe the malignant diagnosis of the patient's relative with
      a history of cancer.
    ssm_occurrences.case.family_histories.relationship_type: The subgroup that describes
      the state of connectedness between members of the unit of society organized
      around kinship ties.
    ssm_occurrences.case.family_histories.relative_with_cancer_history: The yes/no/unknown
      indicator used to describe whether any of the patient's relatives have a history
      of cancer.
    ssm_occurrences.case.family_histories.state: The current state of the object.
    ssm_occurrences.case.family_histories.submitter_id: A project-specific identifier
      for a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    ssm_occurrences.case.follow_ups.days_to_follow_up: Number of days between the
      date used for index and the date of the patient's last follow-up appointment
      or contact.
    ssm_occurrences.case.follow_ups.molecular_tests.gene_symbol: The text term used
      to describe a gene targeted or included in molecular analysis. For rearrangements,
      this should be used to represent the reference gene.
    ssm_occurrences.case.follow_ups.molecular_tests.molecular_analysis_method: The
      text term used to describe the method used for molecular analysis.
    ssm_occurrences.case.follow_ups.molecular_tests.submitter_id: A project-specific
      identifier for a node. This property is the calling card/nickname/alias for
      a unit of submission. It can be used in place of the uuid for identifying or
      recalling a node.
    ssm_occurrences.case.follow_ups.molecular_tests.test_result: The text term used
      to describe the result of the molecular test. If the test result was a numeric
      value see test_value.
    ssm_occurrences.case.follow_ups.other_clinical_attributes.submitter_id: A project-specific
      identifier for a node. This property is the calling card/nickname/alias for
      a unit of submission. It can be used in place of the uuid for identifying or
      recalling a node.
    ssm_occurrences.case.follow_ups.submitter_id: A project-specific identifier for
      a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    ssm_occurrences.case.index_date: The text term used to describe the reference
      or anchor date used when for date obfuscation, where a single date is obscurred
      by creating one or more date ranges in relation to this date.
    ssm_occurrences.case.lost_to_followup: The yes/no/unknown indicator used to describe
      whether a patient was unable to be contacted or seen for follow-up information.
    ssm_occurrences.case.primary_site: The text term used to describe the primary
      site of disease, as categorized by the World Health Organization's (WHO) International
      Classification of Diseases for Oncology (ICD-O). This categorization groups
      cases into general categories. Reference tissue_or_organ_of_origin on the diagnosis
      node for more specific primary sites of disease.
