    ssm_occurrences.case.project.disease_type: Full name for the project
    ssm_occurrences.case.project.id: UUID for the project
    ssm_occurrences.case.project.intended_release_date: Tracks a Project's intended
      release date.
    ssm_occurrences.case.project.name: Display name for the project
    ssm_occurrences.case.project.primary_site: Primary site for the project
    ssm_occurrences.case.project.program.dbgap_accession_number: The dbgap accession
      number provided for the program.
    ssm_occurrences.case.project.program.id: A 128-bit identifier. Depending on the
      mechanism used to generate it, it is either guaranteed to be different from
      all other UUIDs/GUIDs generated until 3400 AD or extremely likely to be different.
      Its relatively small size lends itself well to sorting, ordering, and hashing
      of all sorts, storing in databases, simple allocation, and ease of programming
      in general.
    ssm_occurrences.case.project.program.name: Full name/title of the program.
    ssm_occurrences.case.project.releasable: A project can only be released by the
      user when `releasable` is true.
    ssm_occurrences.case.project.released: To release a project is to tell the GDC
      to include all submitted entities in the next GDC index.
    ssm_occurrences.case.project.state: The possible states a project can be in.  All
      but `open` are equivalent to some type of locked state.
