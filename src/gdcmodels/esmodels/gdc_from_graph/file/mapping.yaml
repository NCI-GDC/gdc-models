    files.cases.follow_ups.imaging_suv_max: The standardized update value (SUV) is
      the effectively dimensionless measure of regional tracer uptake calculated as
      the activity concentration within a 2D region of interest (ROI) or 3D volume
      of interest (VOI) measured on a PET image (nCi1mL) / [injected dose (nCi) /
      body weight (g)]. Specifically, the maximum SUV recorded for a patient.
