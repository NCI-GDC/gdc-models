      only, reported in mutations per megabase (mut/Mb), calculated within the targeted
      capture region or across the whole genome for WGS data.
    files.tmb_nonsynonymous_exonic: Tumor Mutational Burden (TMB) of nonsynonymous
      mutations only, reported in mutations per megabase (mut/Mb), calculated within
      the intersect of the targeted capture region and exonic region.
    files.total_reads: Total number of reads collected from samtools.
    files.tumor_ploidy: Numeric value used to describe the number of sets of chromosomes
      in a cell or an organism. For example, haploid means one set and diploid means
      two sets.
    files.tumor_purity: Numeric value used to describe the ratio of tumor cells compared
      to total cells present in a sample.
    files.updated_datetime: A combination of date and time of day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    files.wgs_coverage: Range of coverage values for WGS aligned reads. Each range
      is non-inclusive to the lower bound.
