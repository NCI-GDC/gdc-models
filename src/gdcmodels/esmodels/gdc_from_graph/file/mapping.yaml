    files.cases.diagnoses.treatments.treatment_type: Text term that describes the
      type of treatment information available within this dataset. Note the value
      of this field may not be an indication that the treatment type was administered
      to this patient. Please reference the treatment_or_therapy property where it
      is indicated whether the patient received this treatment type.
    files.cases.diagnoses.treatments.treatment_type_administered: Text term that describes
      the kind of treatment administered to a patient.
    files.cases.diagnoses.treatments.updated_datetime: A combination of date and time
      of day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    files.cases.diagnoses.tumor_burden: Refers to the number of cancer cells, the
      size of a tumor, or the amount of cancer in the body.
    files.cases.diagnoses.tumor_confined_to_organ_of_origin: The yes/no/unknown indicator
      used to describe whether the tumor is confined to the organ where it originated
