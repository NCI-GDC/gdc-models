    files.cases.diagnoses.primary_diagnosis: Text term used to describe the patient's
      histologic diagnosis, as described by the World Health Organization's (WHO)
      International Classification of Diseases for Oncology (ICD-O).
    files.cases.diagnoses.primary_gleason_grade: The text term used to describe the
      primary Gleason score, which describes the pattern of cells making up the largest
      area of the tumor. The primary and secondary Gleason pattern grades are combined
      to determine the patient's Gleason grade group, which is used to determine the
      aggresiveness of prostate cancer. Note that this grade describes the entire
      prostatectomy specimen and is not specific to the sample used for sequencing.
    files.cases.diagnoses.prior_malignancy: The yes/no/unknown indicator used to describe
      the patient's history of prior cancer diagnosis.
    files.cases.diagnoses.prior_treatment: A yes/no/unknown/not applicable indicator
      related to the administration of therapeutic agents received before the body
      specimen was collected.
    files.cases.diagnoses.progression_or_recurrence: Indicates whether a patient has
      a progression or recurrence after initial treatment. This can include local,
      regional, or metastatic disease.
    files.cases.diagnoses.residual_disease: Tumor cells that remain in the body following
      cancer treatment.
    files.cases.diagnoses.satellite_nodule_present: Indicator noting whether a nodule
      or tumor is located within a small distance (e.g. 2cm) of the primary tumor.
    files.cases.diagnoses.secondary_gleason_grade: The text term used to describe
      the secondary Gleason score, which describes the pattern of cells making up
      the second largest area of the tumor. The primary and secondary Gleason pattern
