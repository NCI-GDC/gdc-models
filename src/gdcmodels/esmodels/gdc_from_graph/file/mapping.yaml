    files.cases.diagnoses.pathology_details.percent_tumor_invasion: The percentage
      of tumor cells spread locally in a malignant neoplasm through infiltration or
      destruction of adjacent tissue.
    files.cases.diagnoses.pathology_details.percent_tumor_nuclei: Numeric value to
      represent the percentage of tumor nuclei in a malignant neoplasm sample or specimen.
    files.cases.diagnoses.pathology_details.perineural_invasion_present: a yes/no
      indicator to ask if perineural invasion or infiltration of tumor or cancer is
      present.
    files.cases.diagnoses.pathology_details.peripancreatic_lymph_nodes_positive: Enumerated
      numeric value or range of values used to describe the number of peripancreatic
      lymph nodes determined to be positive.
    files.cases.diagnoses.pathology_details.peripancreatic_lymph_nodes_tested: The
