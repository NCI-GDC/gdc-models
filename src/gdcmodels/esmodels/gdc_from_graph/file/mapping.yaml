      prior diagnosed tumor.
    files.cases.follow_ups.hormone_replacement_therapy_type: The specific type of
      hormone replacement therapy received by the patient.
    files.cases.follow_ups.id: A 128-bit identifier. Depending on the mechanism used
      to generate it, it is either guaranteed to be different from all other UUIDs/GUIDs
