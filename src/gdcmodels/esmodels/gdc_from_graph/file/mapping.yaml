    files.cases.diagnoses.treatments.created_datetime: A combination of date and time
      of day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    files.cases.diagnoses.treatments.days_to_treatment_end: Number of days between
      the date used for index and the date the treatment ended.
    files.cases.diagnoses.treatments.days_to_treatment_start: Number of days between
      the date used for index and the date the treatment started.
    files.cases.diagnoses.treatments.drug_category: A broad categorization of the
      type of drug administered.
    files.cases.diagnoses.treatments.embolic_agent: A substance used to block an artery,
      thereby eliminating the blood flow to a specific part of an organ. An embolic
      agent may cause permanent or temporary blockage depending on the nature of the
      material used.
    files.cases.diagnoses.treatments.id: A 128-bit identifier. Depending on the mechanism
      used to generate it, it is either guaranteed to be different from all other
      UUIDs/GUIDs generated until 3400 AD or extremely likely to be different. Its
      relatively small size lends itself well to sorting, ordering, and hashing of
      all sorts, storing in databases, simple allocation, and ease of programming
      in general.
    files.cases.diagnoses.treatments.initial_disease_status: The text term used to
      describe the status of the patient's malignancy when the treatment began.
    files.cases.diagnoses.treatments.lesions_treated_number: The number of lesions
      treated.
    files.cases.diagnoses.treatments.margin_distance: Numeric value that represents
      the distance between the tumor and the surgical margin
    files.cases.diagnoses.treatments.margin_status: The determination of the presence
