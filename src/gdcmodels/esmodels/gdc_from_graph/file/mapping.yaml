    files.cases.diagnoses.treatments.radiosensitizing_agent: Indication if an agent
      that makes tumor cells more sensitive to radiation therapy was used in treatment.
    files.cases.diagnoses.treatments.reason_treatment_ended: The text term used to
      describe the reason a specific treatment or regimen ended.
    files.cases.diagnoses.treatments.reason_treatment_not_given: The reason the treatment
      was not administered.
    files.cases.diagnoses.treatments.regimen_or_line_of_therapy: The text term used
      to describe the regimen or line of therapy.
    files.cases.diagnoses.treatments.residual_disease: Tumor cells that remain in
      the body following cancer treatment.
    files.cases.diagnoses.treatments.route_of_administration: The pathway by which
      a substance is administered in order to reach the site of action in the body.
    files.cases.diagnoses.treatments.state: The current state of the object.
    files.cases.diagnoses.treatments.submitter_id: A project-specific identifier for
      a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    files.cases.diagnoses.treatments.therapeutic_agents: Text identification of the
      individual agent(s) used as part of a treatment regimen.
    files.cases.diagnoses.treatments.therapeutic_levels_achieved: An indication that
      the intended level of therapeutic agent was achieved in an individual.
    files.cases.diagnoses.treatments.therapeutic_target_level: Describes a specific
