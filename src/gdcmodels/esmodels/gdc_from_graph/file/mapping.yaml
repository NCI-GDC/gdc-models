      used for relieving urinary obstruction due to nodular hyperplasia of the prostate
      (benign prostatic hyperplasia).
    files.cases.diagnoses.pathology_details.prostatic_chips_total_count: The text
      term used to describe the total number of prostatic chips, which are generated
      from transurethral resection of the prostate (TURP) procedures and are generally
      used for relieving urinary obstruction due to nodular hyperplasia of the prostate
      (benign prostatic hyperplasia).
    files.cases.diagnoses.pathology_details.prostatic_involvement_percent: Numeric
      value that represents the percentage of prostatic involvement found in a specific
      tissue sample.
    files.cases.diagnoses.pathology_details.residual_tumor: Tumor cells that remain
      in the body following cancer treatment.
    files.cases.diagnoses.pathology_details.residual_tumor_measurement: A measurement
      of the tumor cells that remain in the body following cancer treatment.
    files.cases.diagnoses.pathology_details.rhabdoid_percent: Numeric value that represents
      the percentage of rhabdoid features found in a specific tissue sample.
    files.cases.diagnoses.pathology_details.rhabdoid_present: Indicator describing
      whether rhabdoid features were present.
    files.cases.diagnoses.pathology_details.sarcomatoid_percent: Numeric value that
