      used to determine the aggresiveness of prostate cancer. Note that this grade
      describes the entire prostatectomy specimen and is not specific to the sample
      used for sequencing.
    files.cases.diagnoses.site_of_resection_or_biopsy: The text term used to describe
      the anatomic site of the resection or biopsy of the patient's malignant disease,
      as described by the World Health Organization's (WHO) International Classification
      of Diseases for Oncology (ICD-O).
    files.cases.diagnoses.sites_of_involvement: The anatomic sites of disease involvement
