      indicator to ask if large vessel or venous invasion was detected by surgery
      or presence in a tumor specimen.
    files.cases.diagnoses.pathology_details.vascular_invasion_type: Text term that
      represents the type of vascular tumor invasion.
    files.cases.diagnoses.pathology_details.zone_of_origin_prostate: The location
