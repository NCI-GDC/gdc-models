    files.cases.diagnoses.updated_datetime: A combination of date and time of day
      in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    files.cases.diagnoses.weiss_assessment_findings: Histopathologic criteria to evaluate
      adrenocortical tumors.
    files.cases.diagnoses.weiss_assessment_score: 'The text term used to describe
      the overall Weiss assessment score, a commonly used assessment describing the
      malignancy of adrenocortical tumors. The Weiss score is determined based on
      nine histological criteria including the following: high nuclear grade, mitotic
      rate greater than five per 50 high power fields (HPF), atypical mitotic figures,
      eosinophilic tumor cell cytoplasm (greater than 75% tumor cells), diffuse architecture
      (greater than 33% of tumor), necrosis, venous invasion, sinusoidal invasion,
      and capsular invasion.'
    files.cases.diagnoses.who_cns_grade: The WHO (World Health Organization) grading
      classification of CNS tumors, which is based on histological characteristics
      such as cellularity, mitotic activity, pleomorphism, necrosis, and endothelial
      proliferation (neoangiogenesis).
    files.cases.diagnoses.who_nte_grade: The WHO (World Health Organization) grading
      classification of Neuroendocrine Tumors.
    files.cases.diagnoses.wilms_tumor_histologic_subtype: The text term used to describe
      the classification of Wilms tumors distinguishing between favorable and unfavorable
      histologic groups.
    files.cases.diagnoses.year_of_diagnosis: Numeric value to represent the year of
      an individual's initial pathologic diagnosis of cancer.
    files.cases.disease_type: The text term used to describe the type of malignant
      disease, as categorized by the World Health Organization's (WHO) International
      Classification of Diseases for Oncology (ICD-O).
    files.cases.exposures.age_at_last_exposure: The study participant's age (in years)
