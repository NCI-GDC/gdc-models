    files.cases.diagnoses.pathology_details.tumor_basal_diameter: Numeric value in
      millimeters for the lowest layer of a tumor.
    files.cases.diagnoses.pathology_details.tumor_burden: Refers to the number of
      cancer cells, the size of a tumor, or the amount of cancer in the body.
    files.cases.diagnoses.pathology_details.tumor_depth_descriptor: Text term for
