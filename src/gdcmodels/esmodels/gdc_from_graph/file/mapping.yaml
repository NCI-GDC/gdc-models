      diagnosis node.
    files.cases.diagnoses.tumor_regression_grade: A numeric value used to measure
      therapeutic response of the primary tumor and predict patient outcomes based
      on a three-point tumor regression grading system.
    files.cases.diagnoses.uicc_clinical_m: The UICC TNM Classification is an anatomically
      based system that records the primary and regional nodal extent of the tumor
      and the absence or presence of metastases. The clinical M category describes
      the presence or otherwise of distant metastatic spread as determined during
      a clinical exam.
    files.cases.diagnoses.uicc_clinical_n: The UICC TNM Classification is an anatomically
      based system that records the primary and regional nodal extent of the tumor
      and the absence or presence of metastases. The clinical N category describes
      the regional lymph node involvement as determined during a clinical exam.
    files.cases.diagnoses.uicc_clinical_stage: The UICC TNM Classification is an anatomically
      based system that records the primary and regional nodal extent of the tumor
      and the absence or presence of metastases. The clinical stage is based on the
      T, N, and M categories which are determined during a clinical exam.
    files.cases.diagnoses.uicc_clinical_t: The UICC TNM Classification is an anatomically
      based system that records the primary and regional nodal extent of the tumor
      and the absence or presence of metastases. The clinical T category describes
      the primary tumor site and size as determined during a clinical exam.
    files.cases.diagnoses.uicc_pathologic_m: The UICC TNM Classification is an anatomically
      based system that records the primary and regional nodal extent of the tumor
      and the absence or presence of metastases. The pathological M category describes
      the presence or otherwise of distant metastatic spread as determined during
      a pathology review.
    files.cases.diagnoses.uicc_pathologic_n: The UICC TNM Classification is an anatomically
      based system that records the primary and regional nodal extent of the tumor
      and the absence or presence of metastases. The pathological N category describes
      the regional lymph node involvement as determined during a pathology review.
    files.cases.diagnoses.uicc_pathologic_stage: The UICC TNM Classification is an
      anatomically based system that records the primary and regional nodal extent
      of the tumor and the absence or presence of metastases. The pathological stage
      is based on the T, N, and M categories which are determined during a pathological
      review.
    files.cases.diagnoses.uicc_pathologic_t: The UICC TNM Classification is an anatomically
      based system that records the primary and regional nodal extent of the tumor
      and the absence or presence of metastases. The pathological T category describes
      the primary tumor site and size as determined during a pathology review.
    files.cases.diagnoses.uicc_staging_system_edition: The UICC TNM Classification
      is an anatomically based system that records the primary and regional nodal
      extent of the tumor and the absence or presence of metastases. The staging edition
      describes the specific UICC edition used when a patient's stage was determined.
    files.cases.diagnoses.ulceration_indicator: The formation or development of an
