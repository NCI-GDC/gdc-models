    files.cases.diagnoses.pathology_details.sarcomatoid_present: Indicator describing
      whether sarcomatoid features were present.
    files.cases.diagnoses.pathology_details.spindle_cell_percent_range: A quantitative
      measurement of the percent of spindle-shaped melanocytes compared to the number
      of total cells present in a sample.
    files.cases.diagnoses.pathology_details.state: The current state of the object.
    files.cases.diagnoses.pathology_details.submitter_id: A project-specific identifier
      for a node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    files.cases.diagnoses.pathology_details.timepoint_category: Category describing
      a specific point in the time continuum, including those established relative
      to an event.
    files.cases.diagnoses.pathology_details.transglottic_extension: The text term
      used to describe an extension of the tumor beyond the opening into the ventricles
