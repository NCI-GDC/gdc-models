  descriptions:
    cases.annotations.category: Top level characterization of the annotation.
    cases.annotations.classification: Top level classification of the annotation.
    cases.annotations.created_datetime: A combination of date and time of day in the
      form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.annotations.creator: Name of the person or entity responsible for the creation
      of the annotation.
    cases.annotations.id: A 128-bit identifier. Depending on the mechanism used to
      generate it, it is either guaranteed to be different from all other UUIDs/GUIDs
      generated until 3400 AD or extremely likely to be different. Its relatively
      small size lends itself well to sorting, ordering, and hashing of all sorts,
      storing in databases, simple allocation, and ease of programming in general.
    cases.annotations.legacy_created_datetime: A combination of date and time of day
      in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.annotations.legacy_updated_datetime: A combination of date and time of day
      in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.annotations.notes: Open entry for any further description or characterization
      of the data.
    cases.annotations.state: The current state of the object.
    cases.annotations.status: Status of the annotation.
    cases.annotations.submitter_id: A project-specific identifier for a node. This
      property is the calling card/nickname/alias for a unit of submission. It can
      be used in place of the uuid for identifying or recalling a node.
    cases.annotations.updated_datetime: A combination of date and time of day in the
      form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.consent_type: The text term used to describe the type of consent obtain
      from the subject for participation in the study.
    cases.created_datetime: A combination of date and time of day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.days_to_consent: Number of days between the date used for index and the
      date the subject consent was obtained for participation in the study.
    cases.days_to_lost_to_followup: The number of days between the date used for index
      and to the date the patient was lost to follow-up.
    cases.demographic.age_at_index: The patient's age (in years) on the reference
      or anchor date used during date obfuscation.
    cases.demographic.age_is_obfuscated: The age or other properties related to the
      patient's age have been modified for compliance reasons. The actual age may
      differ from what was reported in order to comply with the Health Insurance Portability
      and Accountability Act (HIPAA).
    cases.demographic.cause_of_death: Text term to identify the cause of death for
      a patient.
    cases.demographic.cause_of_death_source: The text term used to describe the source
      used to determine the patient's cause of death.
    cases.demographic.country_of_birth: The name of the country in which the patient
      is born.
    cases.demographic.country_of_residence_at_enrollment: The text term used to describe
      the patient's country of residence at the time they were enrolled in the study.
    cases.demographic.created_datetime: A combination of date and time of day in the
      form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.demographic.days_to_birth: Number of days between the date used for index
      and the date from a person's date of birth represented as a calculated negative
      number of days.
    cases.demographic.days_to_death: Number of days between the date used for index
      and the date from a person's date of death represented as a calculated number
      of days.
    cases.demographic.education_level: The years of schooling completed in graded
      public, private, or parochial schools, and in colleges, universities, or professional
      schools.
    cases.demographic.ethnicity: An individual's self-described social and cultural
      grouping, specifically whether an individual describes themselves as Hispanic
      or Latino. The provided values are based on the categories defined by the U.S.
      Office of Management and Business and used by the U.S. Census Bureau.
    cases.demographic.id: A 128-bit identifier. Depending on the mechanism used to
      generate it, it is either guaranteed to be different from all other UUIDs/GUIDs
      generated until 3400 AD or extremely likely to be different. Its relatively
      small size lends itself well to sorting, ordering, and hashing of all sorts,
      storing in databases, simple allocation, and ease of programming in general.
    cases.demographic.marital_status: A demographic parameter indicating a person's
      current conjugal status.
    cases.demographic.occupation_duration_years: The number of years a patient worked
      in a specific occupation.
    cases.demographic.population_group: A group of individuals united by a common
      factor (e.g., geographic location, ethnicity, disease, age, sex).
    cases.demographic.race: An arbitrary classification of a taxonomic group that
      is a division of a species. It usually arises as a consequence of geographical
      isolation within a species and is characterized by shared heredity, physical
      attributes and behavior, and in the case of humans, by common history, nationality,
      or geographic distribution. The provided values are based on the categories
      defined by the U.S. Office of Management and Business and used by the U.S. Census
      Bureau.
    cases.demographic.sex_at_birth: A textual description of a person's sex at birth.
    cases.demographic.state: The current state of the object.
    cases.demographic.submitter_id: A project-specific identifier for a node. This
      property is the calling card/nickname/alias for a unit of submission. It can
      be used in place of the uuid for identifying or recalling a node.
    cases.demographic.updated_datetime: A combination of date and time of day in the
      form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.demographic.vital_status: The survival state of the person registered on
      the protocol.
    cases.demographic.year_of_birth: Numeric value to represent the calendar year
      in which an individual was born.
    cases.demographic.year_of_birth_range: A categorical value to represent ranges
      of calendar years, during which an individual was born.
    cases.demographic.year_of_death: Numeric value to represent the year of the death
      of an individual.
    cases.diagnoses.adrenal_hormone: Indicates the presence of the adrenal hormone.
      The adrenal hormone is made from cholesterol and protein produced by the adrenal
      glands and regulate electrolyte balance, blood pressure, inflammation, blood
      sugar balance, and immune system control.
    cases.diagnoses.age_at_diagnosis: Age at the time of diagnosis expressed in number
      of days since birth.
    cases.diagnoses.ajcc_clinical_m: Extent of the distant metastasis for the cancer
      based on evidence obtained from clinical assessment parameters determined prior
      to treatment.
    cases.diagnoses.ajcc_clinical_n: Extent of the regional lymph node involvement
      for the cancer based on evidence obtained from clinical assessment parameters
      determined prior to treatment.
    cases.diagnoses.ajcc_clinical_stage: Stage group determined from clinical information
      on the tumor (T), regional node (N) and metastases (M) and by grouping cases
      with similar prognosis for cancer.
    cases.diagnoses.ajcc_clinical_t: Extent of the primary cancer based on evidence
      obtained from clinical assessment parameters determined prior to treatment.
    cases.diagnoses.ajcc_pathologic_m: Code to represent the defined absence or presence
      of distant spread or metastases (M) to locations via vascular channels or lymphatics
      beyond the regional lymph nodes, using criteria established by the American
      Joint Committee on Cancer (AJCC).
    cases.diagnoses.ajcc_pathologic_n: The codes that represent the stage of cancer
      based on the nodes present (N stage) according to criteria based on multiple
      editions of the AJCC's Cancer Staging Manual.
    cases.diagnoses.ajcc_pathologic_stage: The extent of a cancer, especially whether
      the disease has spread from the original site to other parts of the body based
      on AJCC staging criteria.
    cases.diagnoses.ajcc_pathologic_t: Code of pathological T (primary tumor) to define
      the size or contiguous extension of the primary tumor (T), using staging criteria
      from the American Joint Committee on Cancer (AJCC).
    cases.diagnoses.ajcc_serum_tumor_markers: A laboratory test result in which markers
      for testicular cancer are tested in a blood sample for staging purposes.
    cases.diagnoses.ajcc_staging_system_edition: The text term used to describe the
      version or edition of the American Joint Committee on Cancer Staging Handbooks,
      a publication by the group formed for the purpose of developing a system of
      staging for cancer that is acceptable to the American medical profession and
      is compatible with other accepted classifications.
    cases.diagnoses.ann_arbor_b_symptoms: Text term to signify whether lymphoma B-symptoms
      are present as noted in the patient's medical record.
    cases.diagnoses.ann_arbor_b_symptoms_described: Text describing the specific lymphoma
      B-symptoms present.
    cases.diagnoses.ann_arbor_b_symptoms_described_array: Text describing the specific
      lymphoma B-symptoms present.
    cases.diagnoses.ann_arbor_clinical_stage: The text term used to describe the clinical
      classification of lymphoma, as defined by the Ann Arbor Lymphoma Staging System.
    cases.diagnoses.ann_arbor_extranodal_involvement: Indicator that identifies whether
      a patient with malignant lymphoma has lymphomatous involvement of an extranodal
      site.
    cases.diagnoses.ann_arbor_pathologic_stage: The text term used to describe the
      pathologic classification of lymphoma, as defined by the Ann Arbor Lymphoma
      Staging System.
    cases.diagnoses.annotations.category: Top level characterization of the annotation.
    cases.diagnoses.annotations.classification: Top level classification of the annotation.
    cases.diagnoses.annotations.created_datetime: A combination of date and time of
      day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.diagnoses.annotations.creator: Name of the person or entity responsible
      for the creation of the annotation.
    cases.diagnoses.annotations.id: A 128-bit identifier. Depending on the mechanism
      used to generate it, it is either guaranteed to be different from all other
      UUIDs/GUIDs generated until 3400 AD or extremely likely to be different. Its
      relatively small size lends itself well to sorting, ordering, and hashing of
      all sorts, storing in databases, simple allocation, and ease of programming
      in general.
    cases.diagnoses.annotations.legacy_created_datetime: A combination of date and
      time of day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.diagnoses.annotations.legacy_updated_datetime: A combination of date and
      time of day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.diagnoses.annotations.notes: Open entry for any further description or characterization
      of the data.
    cases.diagnoses.annotations.state: The current state of the object.
    cases.diagnoses.annotations.status: Status of the annotation.
    cases.diagnoses.annotations.submitter_id: A project-specific identifier for a
      node. This property is the calling card/nickname/alias for a unit of submission.
      It can be used in place of the uuid for identifying or recalling a node.
    cases.diagnoses.annotations.updated_datetime: A combination of date and time of
      day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.diagnoses.best_overall_response: The best improvement achieved throughout
      the entire course of protocol treatment.
    cases.diagnoses.burkitt_lymphoma_clinical_variant: Burkitt's lymphoma categorization
      based on clinical features that differ from other forms of the same disease.
    cases.diagnoses.calgb_risk_group: A classification strategy for Acute Myeloid
      Leukemia (AML) developed by the cancer research cooperative group Cancer And
      Leukemia Group B that assigns a rating based on the cytogenetic and molecular
      features of a particular disease.
    cases.diagnoses.cancer_detection_method: The method used to detect disease.
    cases.diagnoses.child_pugh_classification: The text term used to describe the
      classification used in the prognosis of chronic liver disease, mainly cirrhosis.
    cases.diagnoses.clark_level: A morphologic finding indicating the cutaneous melanoma
      depth of invasion into the dermis and subcutaneous tissue.
    cases.diagnoses.classification_of_tumor: Text that describes the kind of disease
      present in the tumor specimen as related to a specific timepoint.
    cases.diagnoses.cog_liver_stage: The text term used to describe the staging classification
      of liver tumors, as defined by the Children's Oncology Group (COG). This staging
      system specifically describes the extent of the primary tumor prior to treatment.
    cases.diagnoses.cog_neuroblastoma_risk_group: Text term that represents the categorization
      of patients on the basis of prognostic factors per a system developed by Children's
      Oncology Group (COG). Risk level is used to assign treatment intensity.
    cases.diagnoses.cog_renal_stage: The text term used to describe the staging classification
      of renal tumors, as defined by the Children's Oncology Group (COG).
    cases.diagnoses.cog_rhabdomyosarcoma_risk_group: Text term used to describe the
      classification of rhabdomyosarcoma, as defined by the Children's Oncology Group
      (COG).
    cases.diagnoses.contiguous_organ_invaded: The organ or contiguous site the disease
      migrated to from the primary site.
    cases.diagnoses.created_datetime: A combination of date and time of day in the
      form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.diagnoses.days_to_best_overall_response: Number of days between the date
      used for index and the date of the patient was thought to have the best overall
      response to their disease.
    cases.diagnoses.days_to_diagnosis: Number of days between the date used for index
      and the date the patient was diagnosed with the malignant disease.
    cases.diagnoses.days_to_last_follow_up: Time interval from the date of last follow
      up to the date of initial pathologic diagnosis, represented as a calculated
      number of days.
    cases.diagnoses.days_to_last_known_disease_status: Number of days between the
      date used for index and the date the patient's disease status was known.
    cases.diagnoses.days_to_recurrence: Number of days between the date used for index
      and the date the patient's disease recurred.
    cases.diagnoses.diagnosis_is_primary_disease: Indicates whether this specific
      diagnosis represents the disease that was the primary focus of the study. Additionally,
      this diagnosis is reflected at the case level, which is captured using the case.disease_type
      property.
    cases.diagnoses.double_expressor_lymphoma: An immunohistochemical finding indicating
      the presence of double expression of MYC and BCL2 proteins in the neoplastic
      cells of a tumor sample.
    cases.diagnoses.double_hit_lymphoma: A rare B-cell non-Hodgkin lymphoma that is
      characterized by the abnormal rearrangement of two genes, MYC gene and either
      BCL2 or BCL6 genes. Patients with this type of lymphoma usually respond poorly
      to standard treatments and have a poor prognosis.
    cases.diagnoses.eln_risk_classification: A recommended risk stratification system
      used to provide prognostic information in AML patients undergoing chemotherapy
      as well as allogeneic hematopoietic stem cell transplantation.
    cases.diagnoses.enneking_msts_grade: The text term used to describe the surgical
      grade of the musculoskeletal sarcoma, using the Enneking staging system approved
      by the Musculoskeletal Tumor Society (MSTS).
    cases.diagnoses.enneking_msts_metastasis: Text term and code that represents the
      metastatic stage of the musculoskeletal sarcoma, using the Enneking staging
      system approved by the Musculoskeletal Tumor Society (MSTS).
    cases.diagnoses.enneking_msts_stage: Text term used to describe the stage of the
      musculoskeletal sarcoma, using the Enneking staging system approved by the Musculoskeletal
      Tumor Society (MSTS).
    cases.diagnoses.enneking_msts_tumor_site: Text term and code that represents the
      tumor site of the musculoskeletal sarcoma, using the Enneking staging system
      approved by the Musculoskeletal Tumor Society (MSTS).
    cases.diagnoses.ensat_clinical_m: A clinical finding about one or more characteristics
      of adrenal cancer, following the rules of the ENSAT staging v7 classification
      system as they pertain to distant metastases.
    cases.diagnoses.ensat_pathologic_n: A pathologic finding about one or more characteristics
      of adrenal cancer, following the rules of the ENSAT staging v7 classification
      system as they pertain to staging of the lymph nodes.
    cases.diagnoses.ensat_pathologic_stage: An adrenal cancer stage defined according
      to the European Network for the Study of Adrenal Tumors (ENSAT) criteria.
    cases.diagnoses.ensat_pathologic_t: A pathologic finding about one or more characteristics
      of adrenal cancer, following the rules of the ENSAT staging v7 classification
      system as they pertain to staging of the primary tumor.
    cases.diagnoses.esophageal_columnar_dysplasia_degree: Text term to describe the
      amount of dysplasia found within the benign esophageal columnar mucosa.
    cases.diagnoses.esophageal_columnar_metaplasia_present: The yes/no/unknown indicator
      used to describe whether esophageal columnar metaplasia was determined to be
      present.
    cases.diagnoses.fab_morphology_code: A classification system for acute myeloid
      leukemias, acute lymphoblastic leukemias, and myelodysplastic syndromes. It
      is based on the morphologic and cytochemical evaluation of bone marrow and peripheral
      blood smears.
    cases.diagnoses.figo_stage: The extent of a cervical or endometrial cancer within
      the body, especially whether the disease has spread from the original site to
      other parts of the body, as described by the International Federation of Gynecology
      and Obstetrics (FIGO) stages.
    cases.diagnoses.figo_staging_edition_year: The text term used to describe the
      edition year of the FIGO staging system used to stage the patient's gynecologic
      tumor.
    cases.diagnoses.first_symptom_longest_duration: The length of time the first presenting
      symptom occurred that related to the diagnosis of the patient with cancer.
    cases.diagnoses.first_symptom_prior_to_diagnosis: Text term used to describe the
      patient's first symptom experienced prior to diagnosis and thought to be related
      to the disease.
    cases.diagnoses.gastric_esophageal_junction_involvement: The yes/no/unknown/not
      reported indicator used to describe whether the tumor is located across the
      gastroesophageal junction.
    cases.diagnoses.gleason_grade_group: The text term used to describe the overall
      grouping of grades defined by the Gleason grading classification, which is used
      to determine the aggressiveness of prostate cancer. Note that this grade describes
      the entire prostatectomy specimen and is not specific to the sample used for
      sequencing.
    cases.diagnoses.gleason_grade_tertiary: The text term used to describe the tertiary
      pattern as described by the Gleason Grading System.
    cases.diagnoses.gleason_patterns_percent: Numeric value that represents the percentage
      of Patterns 4 and 5, which is used when the Gleason score is greater than 7
      to predict prognosis.
    cases.diagnoses.gleason_score: The score derived from universally embraced prostate
      cancer grading system developed by Dr. Donald F. Gleason in 1977. The system
      provides a reproducible description of the glandular architecture of prostate
      tissue to which a pathologist assigns a score depending primarily on the microscopic
      patterns of cancerous glands and cell morphology
    cases.diagnoses.goblet_cells_columnar_mucosa_present: The yes/no/unknown indicator
      used to describe whether goblet cells were determined to be present in the esophageal
      columnar mucosa.
    cases.diagnoses.icd_10_code: Alphanumeric value used to describe the disease code
      from the tenth version of the International Classification of Disease (ICD-10).
    cases.diagnoses.id: A 128-bit identifier. Depending on the mechanism used to generate
      it, it is either guaranteed to be different from all other UUIDs/GUIDs generated
      until 3400 AD or extremely likely to be different. Its relatively small size
      lends itself well to sorting, ordering, and hashing of all sorts, storing in
      databases, simple allocation, and ease of programming in general.
    cases.diagnoses.igcccg_stage: The text term used to describe the International
      Germ Cell Cancer Collaborative Group (IGCCCG), a grouping used to further classify
      metastatic testicular tumors.
    cases.diagnoses.inpc_grade: Text term used to describe the classification of neuroblastic
      differentiation within neuroblastoma tumors, as defined by the International
      Neuroblastoma Pathology Classification (INPC).
    cases.diagnoses.inpc_histologic_group: The text term used to describe the classification
      of neuroblastomas distinguishing between favorable and unfavorable histologic
      groups. The histologic score, defined by the International Neuroblastoma Pathology
      Classification (INPC), is based on age, mitosis-karyorrhexis index (MKI), stromal
      content and degree of tumor cell differentiation.
    cases.diagnoses.inrg_stage: The text term used to describe the staging classification
      of neuroblastic tumors, as defined by the International Neuroblastoma Risk Group
      (INRG).
    cases.diagnoses.inss_stage: Text term used to describe the staging classification
      of neuroblastic tumors, as defined by the International Neuroblastoma Staging
      System (INSS).
    cases.diagnoses.international_prognostic_index: The text term used to describe
      the International Prognostic Index, which classifies the prognosis of patients
      with aggressive non-Hodgkin's lymphoma.
    cases.diagnoses.irs_group: Text term used to describe the classification of rhabdomyosarcoma
      tumors, as defined by the Intergroup Rhabdomyosarcoma Study (IRS).
    cases.diagnoses.irs_stage: The text term used to describe the classification of
      rhabdomyosarcoma tumors, as defined by the Intergroup Rhabdomyosarcoma Study
      (IRS).
    cases.diagnoses.ishak_fibrosis_score: The text term used to describe the classification
      of the histopathologic degree of liver damage.
    cases.diagnoses.iss_stage: The multiple myeloma disease stage at diagnosis.
    cases.diagnoses.last_known_disease_status: Text term that describes the last known
      state or condition of an individual's neoplasm.
    cases.diagnoses.laterality: For tumors in paired organs, designates the side on
      which the cancer originates.
    cases.diagnoses.margin_distance: Numeric value that represents the distance between
      the tumor and the surgical margin
    cases.diagnoses.margins_involved_site: The text term used to describe the anatomic
      sites that were involved in the survival margins.
    cases.diagnoses.masaoka_stage: The text term used to describe the Masaoka staging
      system, a classification that defines prognostic indicators for thymic malignancies
      and predicts tumor recurrence.
    cases.diagnoses.max_tumor_bulk_site: The site of the tumor where the dimension
      or diameter is larger than any other part of the tumor.
    cases.diagnoses.medulloblastoma_molecular_classification: The text term used to
      describe the classification of medulloblastoma tumors based on molecular features.
    cases.diagnoses.melanoma_known_primary: A melanoma which has metastasized from
      a known primary anatomic site.
    cases.diagnoses.metastasis_at_diagnosis: The text term used to describe the extent
      of metastatic disease present at diagnosis.
    cases.diagnoses.method_of_diagnosis: Text term used to describe the method used
      to confirm the patients malignant diagnosis.
    cases.diagnoses.mitosis_karyorrhexis_index: Text term that represents the component
      of the International Neuroblastoma Pathology Classification (INPC) for mitosis-karyorrhexis
      index (MKI).
    cases.diagnoses.morphology: The third edition of the International Classification
      of Diseases for Oncology, published in 2000 used principally in tumor and cancer
      registries for coding the site (topography) and the histology (morphology) of
      neoplasms. The study of the structure of the cells and their arrangement to
      constitute tissues and, finally, the association among these to form organs.
      In pathology, the microscopic process of identifying normal and abnormal morphologic
      characteristics in tissues, by employing various cytochemical and immunocytochemical
      stains. A system of numbered categories for representation of data.
    cases.diagnoses.ovarian_specimen_status: The text term used to describe the physical
      condition of the involved ovary.
    cases.diagnoses.ovarian_surface_involvement: The text term that describes whether
      the surface tissue (outer boundary) of the ovary shows evidence of involvement
      or presence of cancer.
    cases.diagnoses.pathology_details.additional_pathology_findings: A section header
      that includes additional pathologic findings.
    cases.diagnoses.pathology_details.anaplasia_present: Yes/no/unknown/not reported
      indicator used to describe whether anaplasia was present at the time of diagnosis.
    cases.diagnoses.pathology_details.anaplasia_present_type: The text term used to
      describe the morphologic findings indicating the presence of a malignant cellular
      infiltrate characterized by the presence of large pleomorphic cells, necrosis,
      and high mitotic activity in a tissue sample.
    cases.diagnoses.pathology_details.bone_marrow_malignant_cells: The text term used
      to indicate whether there are malignant cells in the bone marrow.
    cases.diagnoses.pathology_details.breslow_thickness: The number that describes
      the distance, in millimeters, between the upper layer of the epidermis and the
      deepest point of tumor penetration.
    cases.diagnoses.pathology_details.breslow_thickness_category: The number that
      describes the distance, in millimeters, between the upper layer of the epidermis
      and the deepest point of tumor penetration.
    cases.diagnoses.pathology_details.circumferential_resection_margin: Numeric value
      used to describe the non-peritonealised bare area of rectum, comprising anterior
      and posterior segments, when submitted as a surgical specimen resulting from
      excision of cancer of the rectum.
    cases.diagnoses.pathology_details.columnar_mucosa_present: Indicator noting whether
      columnar mucosa was present within the tissue.
    cases.diagnoses.pathology_details.consistent_pathology_review: Indicates whether
      a recent review of tissue is consistent with a prior pathology review.
    cases.diagnoses.pathology_details.created_datetime: A combination of date and
      time of day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
    cases.diagnoses.pathology_details.days_to_pathology_detail: Number of days between
      the date used for index and the date a pathologic review of a specific sample
      or slide was performed.
    cases.diagnoses.pathology_details.dysplasia_degree: The degree to which dysplasia
      was involved.
    cases.diagnoses.pathology_details.dysplasia_type: The type of dysplasia involved.
    cases.diagnoses.pathology_details.epithelioid_cell_percent_range: A quantitative
      measurement of the percent of epithelioid melanocytes compared to the number
      of total cells present in a sample.
    cases.diagnoses.pathology_details.extracapsular_extension: The extension of malignant
      tissue situated outside of a specific capsule.
    cases.diagnoses.pathology_details.extracapsular_extension_present: An indication
      of the presence of the extension of malignant tissue situated outside of a specific
      capsule.
    cases.diagnoses.pathology_details.extranodal_extension: Extension of a malignant
      neoplasm beyond the lymph node capsule.
    cases.diagnoses.pathology_details.extraocular_nodule_size: The size of the nodule
      that is outside the eye.
    cases.diagnoses.pathology_details.extrascleral_extension_present: Spread of uveal
      melanoma beyond the sclera.
    cases.diagnoses.pathology_details.extrathyroid_extension: Text term to describe
      the degree to which the primary tumor has extra thyroid extension.
    cases.diagnoses.pathology_details.greatest_tumor_dimension: Numeric value that
      represents the measurement of the widest portion of the tumor in centimeters.
    cases.diagnoses.pathology_details.gross_tumor_weight: Numeric value used to describe
      the gross pathologic tumor weight, measured in grams.
    cases.diagnoses.pathology_details.histologic_progression_type: Text term to describe
      the disease progression as determined by microscopic review of cells and their
      surrounding extracellular environment in tissues.
    cases.diagnoses.pathology_details.id: A 128-bit identifier. Depending on the mechanism
      used to generate it, it is either guaranteed to be different from all other
      UUIDs/GUIDs generated until 3400 AD or extremely likely to be different. Its
      relatively small size lends itself well to sorting, ordering, and hashing of
      all sorts, storing in databases, simple allocation, and ease of programming
      in general.
    cases.diagnoses.pathology_details.intratubular_germ_cell_neoplasia_present: Text
      term to indicate whether the intratubular germ cell neoplasm is present or absent.
    cases.diagnoses.pathology_details.largest_extrapelvic_peritoneal_focus: The text
      term used to describe the diameter of the largest focus originating outside
      of the pelvic peritoneal region.
    cases.diagnoses.pathology_details.lymph_node_dissection_method: The method employed
      to remove a lymph nodes(s)
    cases.diagnoses.pathology_details.lymph_node_dissection_site: The named location(s)
      within the body where a lymph node(s) were removed.
    cases.diagnoses.pathology_details.lymph_node_involved_site: The text term used
      to describe the anatomic site of lymph node involvement.
    cases.diagnoses.pathology_details.lymph_node_involvement: Indicator noting whether
      lymph nodes were involved.
    cases.diagnoses.pathology_details.lymph_nodes_positive: The number of lymph nodes
      involved with disease as determined by pathologic examination.
    cases.diagnoses.pathology_details.lymph_nodes_removed: The number of lymph nodes
      removed during a biopsy or surgical procedure.
    cases.diagnoses.pathology_details.lymph_nodes_tested: The number of lymph nodes
      tested to determine whether lymph nodes were involved with disease as determined
      by a pathologic examination.
    cases.diagnoses.pathology_details.lymphatic_invasion_present: A yes/no indicator
      to ask if small or thin-walled vessel invasion is present, indicating lymphatic
      involvement
    cases.diagnoses.pathology_details.margin_status: The determination of the presence
      of actual or potential neoplastic tissue which has been left outside the boundary
      of a resected specimen within the patient.
    cases.diagnoses.pathology_details.measurement_type: The method used to measure
      tumor size.
    cases.diagnoses.pathology_details.measurement_unit: The type of unit of measure
      being used to express a length or distance.
    cases.diagnoses.pathology_details.metaplasia_present: Indicator noting whether
      metaplasia was present.
    cases.diagnoses.pathology_details.micrometastasis_present: Indication of metastasis
      in the form of small clusters of malignant cells identifiable only under the
      microscope.
    cases.diagnoses.pathology_details.morphologic_architectural_pattern: A specific
      morphologic or pathologic architectural pattern was discovered within the sample
      studied.
    cases.diagnoses.pathology_details.necrosis_percent: A quantitative measurement
      of the percent of cells undergoing necrosis compared to the number of total
      cells present in a sample.
    cases.diagnoses.pathology_details.necrosis_present: Indicator describing whether
      the presence of necrosis was confirmed.
    cases.diagnoses.pathology_details.non_nodal_regional_disease: The text term used
      to describe whether the patient had non-nodal regional disease.
    cases.diagnoses.pathology_details.non_nodal_tumor_deposits: The yes/no/unknown
      indicator used to describe the presence of tumor deposits in the pericolic or
      perirectal fat or in adjacent mesentery away from the leading edge of the tumor.
    cases.diagnoses.pathology_details.number_proliferating_cells: Numeric value that
      represents the count of proliferating cells determined during pathologic review
      of the sample slide(s).
    cases.diagnoses.pathology_details.percent_tumor_invasion: The percentage of tumor
      cells spread locally in a malignant neoplasm through infiltration or destruction
      of adjacent tissue.
    cases.diagnoses.pathology_details.percent_tumor_nuclei: Numeric value to represent
      the percentage of tumor nuclei in a malignant neoplasm sample or specimen.
    cases.diagnoses.pathology_details.perineural_invasion_present: a yes/no indicator
      to ask if perineural invasion or infiltration of tumor or cancer is present.
    cases.diagnoses.pathology_details.peripancreatic_lymph_nodes_positive: Enumerated
