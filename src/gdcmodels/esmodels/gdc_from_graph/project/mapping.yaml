---
_meta:
  arrays: []
  constraints: {}
  descriptions:
    projects.dbgap_accession_number: The dbgap accession number for the project.
    projects.disease_type: Full name for the project
    projects.id: UUID for the project
    projects.intended_release_date: Tracks a Project's intended release date.
    projects.name: Display name for the project
    projects.primary_site: Primary site for the project
    projects.program.dbgap_accession_number: The dbgap accession number provided for
      the program.
    projects.program.id: A 128-bit identifier. Depending on the mechanism used to
      generate it, it is either guaranteed to be different from all other UUIDs/GUIDs
      generated until 3400 AD or extremely likely to be different. Its relatively
      small size lends itself well to sorting, ordering, and hashing of all sorts,
      storing in databases, simple allocation, and ease of programming in general.
    projects.program.name: Full name/title of the program.
    projects.releasable: A project can only be released by the user when `releasable`
      is true.
    projects.released: To release a project is to tell the GDC to include all submitted
      entities in the next GDC index.
    projects.state: The possible states a project can be in.  All but `open` are equivalent
      to some type of locked state.
_size:
  enabled: true
_source:
  excludes:
    - __comment__
dynamic: strict
properties:
  dbgap_accession_number:
    normalizer: clinical_normalizer
    type: keyword
  disease_type:
    copy_to: &id001
      - project_autocomplete
    normalizer: clinical_normalizer
    type: keyword
  intended_release_date:
    normalizer: clinical_normalizer
    type: keyword
  name:
    copy_to: *id001
    type: keyword
  primary_site:
    copy_to: *id001
    normalizer: clinical_normalizer
    type: keyword
  program:
    properties:
      dbgap_accession_number:
        normalizer: clinical_normalizer
        type: keyword
      name:
        type: keyword
      program_id:
        normalizer: clinical_normalizer
        type: keyword
  project_autocomplete:
    fields:
      analyzed:
        analyzer: autocomplete_analyzed
        search_analyzer: lowercase_keyword
        type: text
      lowercase:
        analyzer: lowercase_keyword
        type: text
      prefix:
        analyzer: autocomplete_prefix
        search_analyzer: lowercase_keyword
        type: text
    normalizer: clinical_normalizer
    type: keyword
  project_id:
    copy_to: *id001
    type: keyword
  releasable:
    normalizer: clinical_normalizer
    type: keyword
  released:
    normalizer: clinical_normalizer
    type: keyword
  state:
    normalizer: clinical_normalizer
    type: keyword
  summary:
    properties:
      case_count:
        type: long
      data_categories:
        properties:
          case_count:
            type: long
          data_category:
            normalizer: clinical_normalizer
            type: keyword
          file_count:
            type: long
        type: nested
      experimental_strategies:
        properties:
          case_count:
            type: long
          experimental_strategy:
            type: keyword
          file_count:
            type: long
        type: nested
      file_count:
        type: long
      file_size:
        type: long
