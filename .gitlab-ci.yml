---
include:
  - project: nci-gdc/gitlab-templates
    ref: master
    file:
      - templates/artifacts/python-library.yaml
      - templates/common/trigger.yml

variables:
  LANGUAGE_VERSION: python3.9
  BASE_CONTAINER_VERSION: 3.1.0

tox:
  parallel:
    matrix:
      - LANGUAGE_VERSION: [python3.9, python3.10, python3.11, python3.12, python3.13]
  services:
    - name: docker.osdc.io/ncigdc/ci-elasticsearch-7:${BASE_CONTAINER_VERSION}
      alias: elasticsearch
  variables:
    ES_HOST: elasticsearch

.downstream_repos:
  parallel:
    matrix:
      - TRIGGERED_REPO: 7
        NAME: gdcapi
      - TRIGGERED_REPO: 79
        NAME: esbuild
